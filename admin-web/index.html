<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rochar Gelato — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee;
    --card: #ffffff;
    --ink: #2a1d17;
    --muted: #85766c;
    --border: #eae2d9;
    --accent: #3b2418;       /* dark chocolate */
    --accent-2: #5a3a29;
    --cream: #f1e6d6;
    --red-bg: #fbe9e6; --red: #b3372a;
    --amber-bg: #fcf1dc; --amber: #9a6208;
    --green-bg: #e7f2ea; --green: #22733d;
    --blue-bg: #e7eef8; --blue: #2c5a93;
    --gray-bg: #efebe7; --gray: #6f655e;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; }
  .serif { font-family: "Playfair Display", Georgia, serif; }

  /* ---------- Login ---------- */
  #login { position: fixed; inset: 0; background: var(--accent); display: flex; align-items: center;
    justify-content: center; z-index: 100; padding: 16px; }
  #login.hidden { display: none; }
  .login-card { background: var(--card); border-radius: 18px; padding: 32px 28px; width: 340px; max-width: 100%; text-align: center; }
  .login-card h1 { font-size: 26px; }
  .login-card p { color: var(--muted); margin: 6px 0 20px; font-size: 13px; }
  .pin { width: 100%; padding: 12px; font-size: 22px; letter-spacing: 8px; text-align: center;
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
  .login-error { color: var(--red); min-height: 18px; font-size: 13px; margin: 6px 0; }

  /* ---------- Shell ---------- */
  header.top { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 20; }
  header.top h1 { font-size: 20px; letter-spacing: .3px; }
  header.top small { color: #d9c8b6; font-size: 12px; margin-left: 8px; font-family: Inter, sans-serif; }
  nav.tabs { background: var(--card); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto;
    position: sticky; top: 50px; z-index: 19; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { background: none; border: none; padding: 13px 14px; cursor: pointer; white-space: nowrap;
    color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 80px; }

  /* ---------- Building blocks ---------- */
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
  .section-title h2 { font-size: 22px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 21px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .value.neg { color: var(--red); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--cream); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid #efc9c3; }
  .btn.danger:hover { background: var(--red-bg); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn.block { width: 100%; }
  .link { background: none; border: none; color: var(--blue); cursor: pointer; padding: 0; text-decoration: underline; font-size: 12.5px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tfoot td { font-weight: 600; border-top: 1px solid var(--border); }
  .empty { color: var(--muted); padding: 18px 4px; text-align: center; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-gray { background: var(--gray-bg); color: var(--gray); }

  .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .subtabs button { background: var(--card); border: 1px solid var(--border); border-radius: 99px; padding: 6px 13px; cursor: pointer; }
  .subtabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  .filters label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }

  /* ---------- Forms / modal ---------- */
  dialog { border: none; border-radius: 16px; padding: 0; width: 560px; max-width: calc(100vw - 24px);
    max-height: calc(100vh - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(30, 18, 12, .45); }
  .modal-head { padding: 16px 18px 6px; display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 18px; }
  .modal-body { padding: 8px 18px 4px; }
  .modal-foot { padding: 12px 18px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field > span { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea, .filters input, .filters select, .lines input, .lines select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  .field textarea { min-height: 60px; resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .form-error { color: var(--red); font-size: 13px; min-height: 18px; }
  .lines { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .line { display: grid; grid-template-columns: 1fr 80px 100px 28px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .line.two { grid-template-columns: 1fr 110px 28px; }
  .line .rm { background: none; border: none; color: var(--red); font-size: 18px; cursor: pointer; }
  .line-head { display: grid; grid-template-columns: 1fr 80px 100px 28px; gap: 6px; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .line-head.two { grid-template-columns: 1fr 110px 28px; }
  @media (max-width: 520px) {
    .line { grid-template-columns: 1fr 1fr 28px; }
    .line > select { grid-column: 1 / -1; }
    .line.two { grid-template-columns: 1fr 110px 28px; }
    .line.two > select { grid-column: auto; }
    .line-head:not(.two) { grid-template-columns: 1fr 1fr 28px; }
    .line-head:not(.two) > div:first-child { display: none; }
  }
  .total-box { background: var(--cream); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }

  /* ---------- Orders ---------- */
  .order { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: #fff; }
  .order .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .order .who { font-weight: 600; }
  .order .items { margin: 6px 0; color: var(--ink); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; }
  .cal .day { background: #fff; border: 1px solid var(--border); border-radius: 8px; min-height: 78px; padding: 4px; font-size: 11.5px; overflow: hidden; }
  .cal .day.other { background: transparent; border-color: transparent; }
  .cal .day.today { border-color: var(--accent); border-width: 2px; }
  .cal .d { font-weight: 600; font-size: 12px; margin-bottom: 2px; }
  .cal .ev { display: block; width: 100%; text-align: left; border: none; border-radius: 5px; padding: 2px 4px; margin-bottom: 2px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  @media (max-width: 600px) { .cal .day { min-height: 56px; } .cal .ev { font-size: 10px; padding: 1px 2px; } }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }
  .loading { color: var(--muted); padding: 30px; text-align: center; }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login">
  <div class="login-card">
    <h1 class="serif">Rochar Gelato</h1>
    <p id="loginMsg">Enter your PIN</p>
    <form id="loginForm">
      <input class="pin" id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required>
      <input class="pin" id="pinInput2" type="password" inputmode="numeric" maxlength="12" placeholder="repeat" style="display:none">
      <div class="login-error" id="loginError"></div>
      <button class="btn block" id="loginBtn">Unlock</button>
    </form>
  </div>
</div>

<!-- ======================= APP ======================= -->
<header class="top">
  <h1 class="serif">Rochar Gelato<small>Admin</small></h1>
  <button class="btn ghost sm" style="color:#fff;border-color:#6b4a38" onclick="go('settings')">Settings</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"><div class="loading">Loading…</div></main>

<dialog id="modal"><form method="dialog" id="modalForm" novalidate>
  <div class="modal-head"><h3 id="modalTitle"></h3><button type="button" class="x" onclick="closeModal()">×</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="form-error" id="modalError" style="padding:0 18px"></div>
  <div class="modal-foot" id="modalFoot"></div>
</form></dialog>

<div id="toast"></div>

<script>
// ============================================================================
// Rochar Gelato — admin app. Talks to the FastAPI backend on Render.
// ============================================================================
const API_BASE = "https://api.rochargelato.com";

const TABS = [
  ["dashboard", "Dashboard"], ["orders", "Orders"], ["sales", "Sales"],
  ["production", "Production"], ["inventory", "Inventory"], ["wastage", "Wastage"],
  ["expenses", "Expenses"], ["reports", "Reports"],
];
const CHANNELS = ["Walk-in", "Delivery", "Online", "Reseller", "Event", "Order"];
const PAYMENTS = ["Cash", "GCash", "Maya", "Bank transfer", "Card"];
const WASTE_REASONS = ["melted", "expired", "damaged", "sample / tasting", "failed batch", "other"];
const ORDER_STATUS = {
  pending: ["Pending", "b-gray"], confirmed: ["Confirmed", "b-blue"], in_production: ["In production", "b-amber"],
  ready: ["Ready", "b-green"], completed: ["Completed", "b-gray"], cancelled: ["Cancelled", "b-red"],
};

// ---------------------------------------------------------------- helpers
let TOKEN = null;
try { TOKEN = localStorage.getItem("rochar_token"); } catch (e) {}
const state = { tab: "dashboard", ingredients: [], products: [] };

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && !path.startsWith("/auth/")) { showLogin("Session ended — enter your PIN"); throw new Error("Please log in again."); }
  if (!res.ok) {
    let msg = data && data.detail;
    if (Array.isArray(msg)) msg = msg.map(d => (d.loc ? d.loc.slice(-1)[0] + ": " : "") + d.msg).join("; ");
    throw new Error(msg || ("Server error " + res.status));
  }
  return data;
}
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const peso = n => "₱" + Number(n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const peso0 = n => "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 0 });
const qty = n => { const x = Number(n || 0); return Number.isInteger(x) ? x.toLocaleString() : x.toLocaleString(undefined, { maximumFractionDigits: 3 }); };
function manilaToday() {
  return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
}
const thisMonth = () => manilaToday().slice(0, 7);
function monthBounds(ym) {
  const [y, m] = ym.split("-").map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return [`${ym}-01`, `${ym}-${String(last).padStart(2, "0")}`];
}
function fmtDate(d, withDow = false) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-US", withDow ? { weekday: "short", month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
}
function dueLabel(n) {
  if (n < 0) return `<span class="badge b-red">${-n} day${n === -1 ? "" : "s"} overdue</span>`;
  if (n === 0) return `<span class="badge b-red">Due today</span>`;
  if (n === 1) return `<span class="badge b-amber">Tomorrow</span>`;
  if (n <= 3) return `<span class="badge b-amber">In ${n} days</span>`;
  return `<span class="badge b-gray">In ${n} days</span>`;
}
function toast(msg, isErr = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", isErr ? 5000 : 2500);
}
const options = (list, selected) => list.map(v => `<option ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join("");
const datalist = (id, list) => `<datalist id="${id}">${list.map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;

async function loadCatalog() {
  [state.ingredients, state.products] = await Promise.all([
    api("/ingredients?include_inactive=true"), api("/products?include_inactive=true"),
  ]);
}
const activeProducts = () => state.products.filter(p => p.active);
const activeIngredients = () => state.ingredients.filter(i => i.active);
const productById = id => state.products.find(p => p.id === Number(id));
const ingredientById = id => state.ingredients.find(i => i.id === Number(id));
function productOptions(selected) {
  return `<option value="">— choose —</option>` + activeProducts().map(p =>
    `<option value="${p.id}" ${p.id === Number(selected) ? "selected" : ""}>${esc(p.name)} (${qty(p.current_stock)} in stock)</option>`).join("");
}
function ingredientOptions(selected, list = activeIngredients()) {
  return `<option value="">— choose —</option>` + list.map(i =>
    `<option value="${i.id}" ${i.id === Number(selected) ? "selected" : ""}>${esc(i.name)} (${esc(i.unit)})</option>`).join("");
}

// ---------------------------------------------------------------- modal
let modalSubmit = null;
function openModal(title, bodyHtml, submitLabel, onSubmit, extraFoot = "") {
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHtml;
  $("#modalError").textContent = "";
  $("#modalFoot").innerHTML = extraFoot +
    `<button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>` +
    (submitLabel ? `<button type="submit" class="btn" id="modalSubmit">${esc(submitLabel)}</button>` : "");
  modalSubmit = onSubmit;
  $("#modal").showModal();
  const first = $("#modalBody input:not([type=hidden]), #modalBody select");
  if (first && window.innerWidth > 600) first.focus();
}
function closeModal() { $("#modal").close(); modalSubmit = null; }
$("#modalForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!modalSubmit) return closeModal();
  const btn = $("#modalSubmit"); if (btn) btn.disabled = true;
  $("#modalError").textContent = "";
  try {
    const keepOpen = await modalSubmit(new FormData($("#modalForm")));
    if (!keepOpen) closeModal();
  } catch (err) {
    $("#modalError").textContent = err.message;
  } finally { if (btn) btn.disabled = false; }
});
const num = v => (v === "" || v === null || v === undefined) ? null : Number(v);
const txt = v => { v = (v ?? "").toString().trim(); return v === "" ? null : v; };
function need(cond, msg) { if (!cond) throw new Error(msg); }

// ---------------------------------------------------------------- login
async function showLogin(msg) {
  TOKEN = null; try { localStorage.removeItem("rochar_token"); } catch (e) {}
  $("#login").classList.remove("hidden");
  $("#loginError").textContent = "";
  $("#pinInput").value = ""; $("#pinInput2").value = "";
  let setup = false;
  try { setup = !(await api("/auth/status")).pin_set; }
  catch (e) { $("#loginError").textContent = "Can't reach the server (it may be waking up). Try again in a moment."; }
  $("#login").dataset.setup = setup ? "1" : "";
  $("#pinInput2").style.display = setup ? "" : "none";
  $("#pinInput2").required = setup;
  $("#loginMsg").textContent = setup ? "First time: create a PIN (6+ digits recommended)" : (msg || "Enter your PIN");
  $("#loginBtn").textContent = setup ? "Create PIN" : "Unlock";
  $("#pinInput").focus();
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pin = $("#pinInput").value.trim(), setup = !!$("#login").dataset.setup;
  $("#loginError").textContent = "";
  if (setup && pin !== $("#pinInput2").value.trim()) { $("#loginError").textContent = "The two PINs don't match."; return; }
  $("#loginBtn").disabled = true;
  try {
    const r = await api(setup ? "/auth/setup" : "/auth/login", { method: "POST", body: { pin } });
    TOKEN = r.token; try { localStorage.setItem("rochar_token", TOKEN); } catch (e) {}
    $("#login").classList.add("hidden");
    await start();
  } catch (err) { $("#loginError").textContent = err.message; }
  finally { $("#loginBtn").disabled = false; }
});

// ---------------------------------------------------------------- navigation
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, label]) =>
    `<button class="${state.tab === k ? "active" : ""}" onclick="go('${k}')">${label}</button>`).join("");
}
async function go(tab) {
  state.tab = tab; renderTabs();
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  $("#view").innerHTML = `<div class="loading">Loading…</div>`;
  try { await VIEWS[tab](); }
  catch (err) { $("#view").innerHTML = `<div class="card"><b>Couldn't load this page.</b><p class="muted">${esc(err.message)}</p><button class="btn" onclick="go('${tab}')">Try again</button></div>`; }
}
const refresh = () => go(state.tab);

async function start() {
  await loadCatalog();
  const hash = location.hash.slice(1);
  go(VIEWS[hash] ? hash : "dashboard");
}

// ============================================================================
// DASHBOARD
// ============================================================================
async function viewDashboard() {
  const d = await api("/dashboard");
  const t = d.totals;
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Today · ${fmtDate(d.today, true)}</h2>
      <div class="row"><button class="btn" onclick="newSale()">+ Sale</button>
      <button class="btn ghost" onclick="newOrder()">+ Order</button>
      <button class="btn ghost" onclick="newBatch()">+ Batch</button></div></div>
    <div class="tiles">
      <div class="tile"><div class="label">Sales today</div><div class="value">${peso0(t.sales_today)}</div></div>
      <div class="tile"><div class="label">Sales this month</div><div class="value">${peso0(t.sales_mtd)}</div></div>
      <div class="tile"><div class="label">Expenses this month</div><div class="value">${peso0(t.expenses_mtd)}</div></div>
      <div class="tile"><div class="label">Wastage this month</div><div class="value">${peso0(t.wastage_mtd)}</div></div>
      <div class="tile"><div class="label">Units made this month</div><div class="value">${qty(t.units_produced_mtd)}</div></div>
      <div class="tile"><div class="label">Stock value (ingr. + gelato)</div><div class="value">${peso0(t.ingredient_stock_value + t.product_stock_value)}</div></div>
    </div>
    <div class="card"><h3>Orders due in the next 7 days</h3>
      ${d.upcoming_orders.length ? d.upcoming_orders.map(orderCard).join("") : `<div class="empty">No open orders due this week.</div>`}
    </div>
    <div class="card"><h3>Low stock</h3>
      ${d.low_stock.length ? `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Type</th><th class="num">In stock</th><th class="num">Reorder at</th><th></th></tr></thead><tbody>
        ${d.low_stock.map(i => `<tr><td>${esc(i.name)}</td><td><span class="badge ${i.item_type === "product" ? "b-blue" : "b-gray"}">${esc(i.kind)}</span></td>

async function viewOrders() {
  const mode = state.orderMode;
  let body = "";
  if (mode === "list") {
    const open = await api("/orders?open_only=true");
    body = open.length ? open.map(orderCard).join("") : `<div class="empty">No open orders. Tap “+ Order” to add one.</div>`;
  } else {
    const [a, b] = monthBounds(state.orderMonth);
    const list = await api(`/orders?date_from=${a}&date_to=${b}`);
    body = orderCalendar(list);
  }
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Orders</h2><button class="btn" onclick="newOrder()">+ Order</button></div>
    <div class="subtabs">
      <button class="${mode === "list" ? "active" : ""}" onclick="state.orderMode='list';refresh()">Open orders</button>
      <button class="${mode === "calendar" ? "active" : ""}" onclick="state.orderMode='calendar';refresh()">Calendar</button>
    </div>
    ${mode === "calendar" ? `<div class="row" style="margin-bottom:10px">
      <button class="btn ghost sm" onclick="shiftOrderMonth(-1)">‹</button>
      <b style="min-width:130px;text-align:center">${new Date(state.orderMonth + "-01T00:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</b>
      <button class="btn ghost sm" onclick="shiftOrderMonth(1)">›</button></div>` : ""}
    ${body}`;
}
function shiftOrderMonth(delta) {
  const [y, m] = state.orderMonth.split("-").map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  state.orderMonth = d.toISOString().slice(0, 7); refresh();
}
function orderCalendar(list) {
  state.calendarOrders = list;
  const [y, m] = state.orderMonth.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = first.getUTCDay();
  const today = manilaToday();
  let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="day other"></div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${state.orderMonth}-${String(d).padStart(2, "0")}`;
    const evs = list.filter(o => o.due_date === ds).map(o => {
      const cls = ORDER_STATUS[o.status][1];
      return `<button type="button" class="ev badge ${cls}" onclick="showOrder(${o.id})">${esc(o.customer_name)}</button>`;
    }).join("");
    cells += `<div class="day ${ds === today ? "today" : ""}"><div class="d">${d}</div>${evs}</div>`;
  }
  return `<div class="cal">${cells}</div><p class="small muted">Tap an order to see its details.</p>`;
}
function showOrder(id) {
  const o = (state.calendarOrders || []).find(x => x.id === id);
  if (!o) return;
  openModal(`Order #${o.id}`, orderCard(o), null, null);
}

function itemLinesHtml(items, withPrice = true) {
  const head = withPrice ? `<div class="line-head"><div>Product</div><div>Qty</div><div>Price each</div><div></div></div>`
                         : `<div class="line-head two"><div>Ingredient</div><div>Qty</div><div></div></div>`;
  return `<div class="lines" id="lines">${head}<div id="lineRows"></div>
    <button type="button" class="link" onclick="addLine()">+ add another</button></div>`;
}
function addLine(item = {}) {
  const row = document.createElement("div");
  row.className = "line";
  row.innerHTML = `<select name="li_product" onchange="linePriceDefault(this)">${productOptions(item.product_id)}</select>
    <input name="li_qty" type="number" step="any" min="0" placeholder="Qty" value="${item.qty ?? 1}" oninput="updateTotal()">
    <input name="li_price" type="number" step="any" min="0" placeholder="Price" value="${item.unit_price ?? ""}" oninput="updateTotal()">
    <button type="button" class="rm" onclick="this.parentElement.remove();updateTotal()">×</button>`;
  $("#lineRows").appendChild(row);
  updateTotal();
}
function linePriceDefault(sel) {
  const p = productById(sel.value);
  const price = sel.parentElement.querySelector("[name=li_price]");
  if (p) price.value = p.selling_price;
  updateTotal();
}
function readLines(fd) {
  const ps = fd.getAll("li_product"), qs = fd.getAll("li_qty"), prs = fd.getAll("li_price");
  const items = [];
  ps.forEach((p, i) => {
    if (!p) return;
    need(Number(qs[i]) > 0, "Every item needs a quantity above 0.");
    items.push({ product_id: Number(p), qty: Number(qs[i]), unit_price: num(prs[i]) });
  });
  need(items.length, "Add at least one product.");
  return items;
}
function updateTotal() {
  const box = $("#totalBox"); if (!box) return;
  let sum = 0;
  document.querySelectorAll("#lineRows .line").forEach(r => {
    sum += Number(r.querySelector("[name=li_qty]").value || 0) * Number(r.querySelector("[name=li_price]").value || 0);
  });
  const f = $("#modalForm");
  sum = sum - Number(f.discount?.value || 0) + Number(f.delivery_fee?.value || 0);
  box.querySelector("span:last-child").textContent = peso(sum);
}

function orderForm(o = {}) {

    ${itemLinesHtml()}

      <label class="field"><span>Delivery fee (₱)</span><input name="delivery_fee" type="number" step="any" min="0" value="${o.delivery_fee || 0}" oninput="updateTotal()"></label>
      <label class="field"><span>Deposit paid (₱)</span><input name="deposit_paid" type="number" step="any" min="0" value="${o.deposit_paid || 0}"></label>

function readOrder(fd) {
  const body = {
    customer_name: txt(fd.get("customer_name")), contact: txt(fd.get("contact")),
    due_date: fd.get("due_date"), due_time: txt(fd.get("due_time")), fulfillment: fd.get("fulfillment"),

function ingLine(item = {}) {

function newBatch(productId) {
  openModal("Log a production batch", `
    <div class="grid2">
      <label class="field"><span>Date</span><input name="batch_date" type="date" required value="${manilaToday()}"></label>
      <label class="field"><span>Batch code (optional)</span><input name="batch_code" placeholder="e.g. BBC-0924"></label>
      <label class="field"><span>Product *</span><select name="product_id" id="batchProduct" onchange="loadRecipeLines()">${productOptions(productId)}</select></label>
      <label class="field"><span>Units made *</span><input name="units_produced" id="batchUnits" type="number" step="any" min="0" oninput="loadRecipeLinesDebounced()"></label>
    </div>
    <div class="row spread"><b class="small">Ingredients used</b><span class="small muted" id="recipeNote"></span></div>
    <div class="lines"><div class="line-head two"><div>Ingredient</div><div>Qty used</div><div></div></div>
      <div id="lineRows"></div><button type="button" class="link" onclick="ingLine()">+ add ingredient</button></div>
    <p class="hint">Filled in from the saved recipe × units made. Adjust if this batch was different — these amounts come out of ingredient stock.</p>
    <label class="field"><span>Notes</span><input name="notes"></label>`, "Save batch", async fd => {
    const ids = fd.getAll("ing_id"), qs = fd.getAll("ing_qty");
    const ingredients = [];
    ids.forEach((id, i) => { if (id && Number(qs[i]) > 0) ingredients.push({ ingredient_id: Number(id), qty_used: Number(qs[i]) }); });
    need(fd.get("product_id"), "Choose a product.");
    need(Number(fd.get("units_produced")) > 0, "Enter how many units were made.");
    if (!ingredients.length && !confirm("No ingredients listed — stock won't be deducted and the batch cost will be ₱0. Save anyway?")) return true;

      batch_date: fd.get("batch_date"), product_id: Number(fd.get("product_id")), units_produced: Number(fd.get("units_produced")),
      batch_code: txt(fd.get("batch_code")), notes: txt(fd.get("notes")), ingredients } });
    toast(`Batch saved — ${peso(b.total_cost / b.units_produced)} per unit`); await loadCatalog(); refresh();
  });
}
let _recipeTimer = null;
function loadRecipeLinesDebounced() { clearTimeout(_recipeTimer); _recipeTimer = setTimeout(loadRecipeLines, 350); }
async function loadRecipeLines() {
  const pid = $("#batchProduct").value, units = Number($("#batchUnits").value);
  if (!pid || !(units > 0)) return;
  const lines = await api(`/production/recipe-preview?product_id=${pid}&units=${units}`);
  $("#lineRows").innerHTML = "";
  lines.forEach(ingLine);
  const cost = lines.reduce((s, l) => s + Number(l.cost), 0);
  $("#recipeNote").textContent = lines.length ? `Recipe cost ≈ ${peso(cost)} (${peso(cost / units)}/unit)` : "No recipe saved for this product — add ingredients by hand, or set a recipe in Inventory → Products.";
}
async function deleteBatch(id) {
  if (!confirm("Delete this batch? Its ingredients go back into stock and its units come out of product stock.")) return;
  try { await api(`/production/${id}`, { method: "DELETE" }); toast("Batch deleted"); await loadCatalog(); refresh(); }
  catch (err) { toast(err.message, true); }
}

      <div class="table-wrap"><table>

async function editRecipe(id) {
  const p = productById(id);
  const lines = await api(`/products/${id}/recipe`);
  openModal(`Recipe — ${p.name}`, `
    <p class="hint" style="margin-top:0">How much of each ingredient goes into <b>ONE</b> unit of this product (include the tub, lid and sticker as packaging). The production form multiplies this by the units made.</p>
    <div class="lines"><div class="line-head two"><div>Ingredient</div><div>Per 1 unit</div><div></div></div>
      <div id="lineRows"></div><button type="button" class="link" onclick="ingLine()">+ add ingredient</button></div>`,
    "Save recipe", async fd => {
      const ids = fd.getAll("ing_id"), qs = fd.getAll("ing_qty");
      const items = [];
      ids.forEach((iid, i) => { if (iid) { need(Number(qs[i]) > 0, "Every ingredient needs an amount above 0."); items.push({ ingredient_id: Number(iid), qty_per_unit: Number(qs[i]) }); } });
      const saved = await api(`/products/${id}/recipe`, { method: "PUT", body: { items } });
      const cost = saved.reduce((s, l) => s + Number(l.line_cost), 0);
      toast(`Recipe saved — ${peso(cost)} per unit at current prices`); await loadCatalog(); refresh();
    });
  if (lines.length) lines.forEach(ingLine); else { ingLine(); ingLine(); ingLine(); }
}
function newPurchase(ingredientId) {
  openModal("Record a purchase", `
    <div class="grid2">
      <label class="field"><span>Date</span><input name="purchase_date" type="date" required value="${manilaToday()}"></label>

    need(fd.get("ingredient_id"), "Choose an item.");
    need(Number(fd.get("qty")) > 0, "Enter the quantity bought.");
    need(fd.get("total_cost") !== "", "Enter the total paid.");
    await api("/purchases", { method: "POST", body: {

function purchaseHint(id) {

async function deletePurchase(id) {
  if (!confirm("Delete this purchase? Its quantity comes back out of stock.")) return;
  try { await api(`/purchases/${id}`, { method: "DELETE" }); toast("Purchase deleted"); await loadCatalog(); refresh(); }

    ${monthFilter("repMonth")}
    <div class="tiles">
      <div class="tile"><div class="label">Sales (${s.sale_count})</div><div class="value">${peso0(s.revenue)}</div></div>
      <div class="tile"><div class="label">Cost of gelato sold</div><div class="value">${peso0(s.cogs)}</div></div>
      <div class="tile"><div class="label">Gross profit${s.gross_margin_pct !== null ? ` · ${s.gross_margin_pct}%` : ""}</div><div class="value ${s.gross_profit < 0 ? "neg" : ""}">${peso0(s.gross_profit)}</div></div>
      <div class="tile"><div class="label">Wastage</div><div class="value">${peso0(s.wastage)}</div></div>
      <div class="tile"><div class="label">Operating expenses</div><div class="value">${peso0(s.expenses)}</div></div>
      <div class="tile"><div class="label">Net profit</div><div class="value ${s.net_profit < 0 ? "neg" : ""}">${peso0(s.net_profit)}</div></div>
    </div>
    <div class="card small muted" style="padding:12px 16px">Net profit = sales − cost of gelato sold − wastage − expenses. Ingredient purchases this month
      (<b>${peso(s.ingredient_purchases)}</b>) are stock, not an expense — they reach profit when that gelato is sold or wasted.
      Sales include ${peso(s.delivery_fees)} of delivery fees charged and are after ${peso(s.discounts)} of discounts.</div>
    <div class="card"><h3>Sales by product</h3>${tbl(`<th>Product</th><th class="num">Qty</th><th class="num">Sales</th><th class="num">Cost</th><th class="num">Profit</th>`,
      r.sales_by_product.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${qty(p.qty)}</td><td class="num">${peso(p.gross_sales)}</td><td class="num">${peso(p.cogs)}</td><td class="num">${peso(p.gross_sales - p.cogs)}</td></tr>`).join(""), "No sales.")}</div>
    <div class="grid2">
      <div class="card"><h3>By channel</h3>${tbl(`<th>Channel</th><th class="num">Sales</th><th class="num">Amount</th>`,
        r.sales_by_channel.map(c => `<tr><td>${esc(c.channel)}</td><td class="num">${c.sale_count}</td><td class="num">${peso(c.revenue)}</td></tr>`).join(""), "No sales.")}</div>
      <div class="card"><h3>By payment method</h3>${tbl(`<th>Method</th><th class="num">Amount</th>`,
        r.sales_by_payment_method.map(c => `<tr><td>${esc(c.payment_method)}</td><td class="num">${peso(c.revenue)}</td></tr>`).join(""), "No sales.")}</div>
      <div class="card"><h3>Expenses by category</h3>${tbl(`<th>Category</th><th class="num">Entries</th><th class="num">Amount</th>`,
        r.expenses_by_category.map(c => `<tr><td>${esc(c.category)}</td><td class="num">${c.entries}</td><td class="num">${peso(c.amount)}</td></tr>`).join(""), "No expenses.")}</div>
      <div class="card"><h3>Wastage</h3>${tbl(`<th>Type</th><th>Reason</th><th class="num">Cost</th>`,
        r.wastage_breakdown.map(w => `<tr><td>${esc(w.item_type)}</td><td>${esc(w.reason)}</td><td class="num">${peso(w.cost_value)}</td></tr>`).join(""), "No wastage.")}</div>
    </div>
    <div class="card"><h3>Production</h3>${tbl(`<th>Product</th><th class="num">Batches</th><th class="num">Units</th><th class="num">Cost</th><th class="num">Cost / unit</th>`,
      r.production.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.batches}</td><td class="num">${qty(p.units)}</td><td class="num">${peso(p.cost)}</td><td class="num">${peso(p.cost_per_unit)}</td></tr>`).join(""), "No batches made.")}</div>
    <div class="grid2">
      <div class="card"><h3>Daily sales</h3>${tbl(`<th>Day</th><th class="num">Sales</th>`,
        r.daily_sales.map(d => `<tr><td>${fmtDate(d.day, true)}</td><td class="num">${peso(d.revenue)}</td></tr>`).join(""), "No sales.")}</div>
      <div class="card"><h3>Orders due this month</h3>${tbl(`<th>Status</th><th class="num">Count</th>`,
        Object.entries(r.orders_by_status).map(([k, v]) => `<tr><td>${ORDER_STATUS[k] ? ORDER_STATUS[k][0] : esc(k)}</td><td class="num">${v}</td></tr>`).join(""), "No orders.")}
        <h3 style="margin-top:14px">Ingredient purchases</h3>${tbl(`<th>Type</th><th class="num">Amount</th>`,
        r.purchases_by_kind.map(p => `<tr><td>${esc(p.kind)}</td><td class="num">${peso(p.amount)}</td></tr>`).join(""), "No purchases.")}</div>
    </div>`;
}

// ============================================================================
// SETTINGS
// ============================================================================
async function viewSettings() {
  const s = await api("/settings");
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Settings</h2><button class="btn ghost" onclick="logout()">Log out</button></div>
    <div class="card"><h3>Email alerts</h3>
      <p class="small">${s.email_configured ? `<span class="badge b-green">Email is set up</span>` : `<span class="badge b-amber">Email not set up on the server yet</span> <span class="muted">— add SMTP_USER and SMTP_PASSWORD on Render.</span>`}</p>
      <p class="small muted">Once a day (from the hour below, Manila time) the app emails a summary of low-stock items and orders due soon. Nothing is sent on days with nothing to report.</p>
      <form id="settingsForm">
        <label class="field"><span>Send alerts to (separate several with commas)</span><input name="alert_emails" value="${esc(s.alert_emails)}" placeholder="you@gmail.com, wife@gmail.com"></label>
        <div class="grid2">
          <label class="field"><span>Send from (hour, 0–23)</span><input name="alert_hour" type="number" min="0" max="23" value="${esc(s.alert_hour || 7)}"></label>
          <label class="field"><span>Warn about orders due within (days)</span><input name="order_alert_days" type="number" min="0" max="30" value="${esc(s.order_alert_days)}"></label>
        </div>
        <label class="row small" style="margin-bottom:12px"><input type="checkbox" name="alerts_enabled" ${s.alerts_enabled === "true" ? "checked" : ""} style="width:auto"> Alerts on</label>
        <div class="row"><button class="btn">Save</button>
          <button type="button" class="btn ghost" onclick="previewAlert()">Preview today's alert</button>
          <button type="button" class="btn ghost" onclick="testEmail()">Send test email</button></div>
      </form>
    </div>
    <div class="card"><h3>Change PIN</h3>
      <form id="pinForm" class="grid2">
        <label class="field"><span>Current PIN</span><input name="current_pin" type="password" inputmode="numeric" required></label>
        <label class="field"><span>New PIN (4–12 digits)</span><input name="new_pin" type="password" inputmode="numeric" required></label>
        <div><button class="btn">Change PIN</button></div>
      </form>
      <p class="small muted">Changing the PIN logs out every other phone and computer.</p>
    </div>`;
  $("#settingsForm").onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target);
    try {
      await api("/settings", { method: "PUT", body: { alert_emails: fd.get("alert_emails"), alert_hour: Number(fd.get("alert_hour")),
        order_alert_days: Number(fd.get("order_alert_days")), alerts_enabled: fd.get("alerts_enabled") === "on" } });
      toast("Settings saved");
    } catch (err) { toast(err.message, true); }
  };
  $("#pinForm").onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target);
    try {
      const r = await api("/auth/change-pin", { method: "POST", body: { current_pin: fd.get("current_pin"), new_pin: fd.get("new_pin") } });
      TOKEN = r.token; try { localStorage.setItem("rochar_token", TOKEN); } catch (x) {}
      e.target.reset(); toast("PIN changed");
    } catch (err) { toast(err.message, true); }
  };
}
async function previewAlert() {
  try {
    const p = await api("/alerts/preview");
    openModal("Today's alert", p.would_send
      ? `<p><b>${esc(p.subject)}</b></p><pre style="white-space:pre-wrap;font:inherit;background:var(--cream);padding:10px;border-radius:8px">${esc(p.text)}</pre>
         <p class="small muted">To: ${esc(p.recipients.join(", ") || "(no address set)")}</p>`
      : `<p>Nothing to report today — no low stock and no orders due soon.</p>`,
      p.would_send && p.email_method ? "Send it now" : null,
      async () => { const r = await api("/alerts/run?force=true", { method: "POST" }); toast(r.sent ? "Alert sent" : r.reason, !r.sent); });
  } catch (err) { toast(err.message, true); }
}
async function testEmail() {
  try { const r = await api("/alerts/test", { method: "POST" }); toast("Test email sent to " + r.sent_to.join(", ")); }
  catch (err) { toast(err.message, true); }
}
async function logout() {
  try { await api("/auth/logout", { method: "POST" }); } catch (e) {}
  showLogin();
}

// ---------------------------------------------------------------- boot
const VIEWS = {
  dashboard: viewDashboard, orders: viewOrders, sales: viewSales, production: viewProduction,
  inventory: viewInventory, wastage: viewWastage, expenses: viewExpenses, reports: viewReports, settings: viewSettings,
};
renderTabs();
if (TOKEN) { $("#login").classList.add("hidden"); start().catch(() => {}); } else showLogin();
</script>
</body>
