  try {
    await api(`/customers/${customerId}/prices/${itemId}`, { method: "PUT", body: { price: v } });
    $("#disc_" + itemId).textContent = v === null || !retail ? "—" : Math.round((1 - v / retail) * 100) + "%";
    toast("Price saved"); loadCustomers().catch(() => {});
  } catch (err) { toast(err.message, true); }
}

// ============================================================================
// FINANCE — reconciliation, receivables, liabilities
// ============================================================================
async function viewReconciliation() {
  if (!S.reconDate) S.reconDate = manilaToday();
  const [r, days] = await Promise.all([api(`/reconciliation/${S.reconDate}`), api("/reconciliation-days")]);
  S.recon = r;
  const act = m => r.actual[m] ?? "";
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Reconciliation</h2>
      <div class="filters" style="margin:0"><label>Day<input type="date" value="${S.reconDate}" max="${manilaToday()}" onchange="S.reconDate=this.value;refresh()"></label></div></div>
    <div class="grid2" style="grid-template-columns:2fr 1fr;align-items:start">
    <div>
      ${r.locked ? `<div class="locked-banner">🔒 Reconciled and locked ${r.locked_at ? fmtDateTime(r.locked_at) : ""}. Sales and payments on this day can't be changed.
        <button class="link" onclick="unlockDay()">Unlock</button>${r.changed_since_lock ? `<br><b>Note:</b> the system total has changed since locking.` : ""}</div>` : ""}
      <div class="card"><h3>${fmtDate(S.reconDate, false)} — system vs. actual deposits</h3>
        <table><thead><tr><th>Account</th><th class="num">System (POS)</th><th class="num" style="width:170px">Actual deposit</th><th class="num">Variance</th></tr></thead><tbody>
        ${r.methods.map(m => `<tr><td><b>${m}</b></td><td class="num">${money(r.expected[m])}</td>
          <td class="num"><input type="number" step="any" min="0" inputmode="decimal" data-actual="${m}" value="${act(m)}" ${r.locked ? "disabled" : ""} oninput="reconCalc()"
            style="width:150px;text-align:right;padding:7px;border:1px solid var(--border);border-radius:8px" placeholder="${r.expected[m]}"></td>
          <td class="num" id="var_${m}"></td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${money(r.total_expected)}</td><td class="num" id="actTotal"></td><td class="num" id="varTotal"></td></tr></tfoot></table>
        <label class="field" style="margin-top:12px"><span>Notes (explain any variance)</span><textarea id="reconNotes" ${r.locked ? "disabled" : ""}>${esc(r.notes)}</textarea></label>
        ${r.locked ? "" : `<div class="row"><button class="btn ghost" onclick="saveRecon()">Save draft</button>
          <button class="btn green big" onclick="lockDay()">RECONCILE & LOCK DAY</button></div>`}
      </div>
      <div class="card"><h3>What the system counted (${r.lines.length})</h3>
        <table><thead><tr><th>Time</th><th>What</th><th>Account</th><th class="num">Amount</th></tr></thead><tbody>
        ${r.lines.map(l => `<tr><td>${fmtTime(l.time)}</td><td>${l.type === "sale" ? `Sale #${l.ref}` : `Payment on #${l.ref}`} · ${esc(l.who || "—")}</td><td>${l.method}</td><td class="num">${money(l.amount)}</td></tr>`).join("")
          || `<tr><td colspan="4" class="empty">No paid sales or payments this day.</td></tr>`}</tbody></table>
        <p class="small muted">Counts paid orders finished this day (including delivery fee, since the customer pays it to you) plus credit payments received this day. Credit sales count on the day they're paid.</p></div>
    </div>
    <div class="card"><h3>Recent days</h3>
      ${days.map(x => `<div class="list-item" onclick="S.reconDate='${x.date}';refresh()" style="${x.date === S.reconDate ? "background:var(--cream);margin:0 -8px;padding:10px 8px;border-radius:8px" : ""}">
        <div>${fmtDate(x.date)}<br><span class="small muted">system ${money(x.expected)}</span></div>
        <div class="r">${x.locked ? `<span class="badge b-green">🔒 locked</span>` : x.date === manilaToday() ? `<span class="badge b-gray">today</span>` : `<span class="badge b-red">pending</span>`}
          ${x.variance !== null && x.variance !== 0 ? `<br><span class="small ${x.variance < 0 ? "var-neg" : "var-pos"}">${x.variance > 0 ? "+" : ""}${money(x.variance)}</span>` : ""}</div></div>`).join("")
        || `<div class="empty">No money in yet.</div>`}
    </div></div>`;
  reconCalc();
}
function reconActual() {
  const a = {}; $$("[data-actual]").forEach(i => { if (i.value !== "") a[i.dataset.actual] = Number(i.value); }); return a;
}
function reconCalc() {
  const r = S.recon, a = reconActual();
  let tot = 0, vtot = 0, any = false;
  r.methods.forEach(m => {
    const cell = $("#var_" + m);
    if (a[m] === undefined) { cell.innerHTML = `<span class="muted">—</span>`; return; }
    any = true; tot += a[m]; const v = Math.round((a[m] - r.expected[m]) * 100) / 100; vtot += v;
    cell.innerHTML = `<b class="${v === 0 ? "var-zero" : v < 0 ? "var-neg" : "var-pos"}">${v === 0 ? "✓ 0" : (v > 0 ? "+" : "") + money(v)}</b>`;
  });
  $("#actTotal").textContent = any ? money(tot) : "";
  $("#varTotal").innerHTML = any ? `<b class="${Math.abs(vtot) < 0.005 ? "var-zero" : vtot < 0 ? "var-neg" : "var-pos"}">${(vtot > 0 ? "+" : "") + money(vtot)}</b>` : "";
}
async function saveRecon() {
  try { await api(`/reconciliation/${S.reconDate}`, { method: "PUT", body: { actual: reconActual(), notes: $("#reconNotes").value } }); toast("Draft saved"); refresh(); }
  catch (err) { toast(err.message, true); }
}
async function lockDay() {
  const r = S.recon, a = reconActual();
  const missing = r.methods.filter(m => a[m] === undefined);
  const variance = r.methods.reduce((s, m) => s + (a[m] ?? 0) - r.expected[m], 0);
  let msg = `Lock ${fmtDate(S.reconDate, false)}?`;
  if (missing.length) msg += `\n${missing.join(", ")} left blank = ₱0 deposited.`;
  if (Math.abs(variance) >= 0.01) msg += `\nVariance: ${money(variance)}${$("#reconNotes").value.trim() ? "" : " (consider adding a note)"}.`;
  msg += `\nAfter locking, that day's sales and payments can't be edited or voided.`;
  if (!confirm(msg)) return;
  try { await api(`/reconciliation/${S.reconDate}/lock`, { method: "POST", body: { actual: a, notes: $("#reconNotes").value } }); toast("Day reconciled & locked"); refresh(); }
  catch (err) { toast(err.message, true); }
}
async function unlockDay() {
  if (!confirm("Unlock this day? Its sales and payments become editable again, and you'll need to reconcile it again.")) return;
  try { await api(`/reconciliation/${S.reconDate}/unlock`, { method: "POST" }); toast("Unlocked"); refresh(); }
  catch (err) { toast(err.message, true); }
}

async function viewReceivables() {
  const show = S.recvShow || "open";
  const r = await api(`/receivables?show=${show}`);
  S.receivables = r.entries;
  const statusBadge = o => ({ unpaid: "b-red", partial: "b-amber", settled: "b-green", cancelled: "b-gray" })[o.receivable_status];
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Receivables</h2></div>
    <div class="tiles"><div class="tile"><div class="label">Total outstanding</div><div class="value">${money(r.outstanding)}</div></div>
      ${r.by_client.slice(0, 5).map(c => `<div class="tile"><div class="label">${esc(c.customer)}</div><div class="value">${money(c.balance)}</div></div>`).join("")}</div>
    <div class="chips"><button class="${show === "open" ? "active" : ""}" onclick="S.recvShow='open';refresh()">Still owed</button>
      <button class="${show === "all" ? "active" : ""}" onclick="S.recvShow='all';refresh()">All credit sales</button></div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Order</th><th>Date</th><th>Client</th><th>Items</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th></th></tr></thead>
      <tbody>${r.entries.map(o => { const c = o.receivable_status === "cancelled";
        return `<tr class="${c ? "voided" : ""}">
        <td><button class="link" onclick="S.history=S.receivables;showSale(${o.id})">#${o.id}</button></td>
        <td>${fmtDate(manilaParts(new Date(o.completed_at)).date)}</td>
        <td class="${c ? "strike" : ""}"><b>${esc(o.customer_name)}</b>${o.customer_tier === "Reseller" ? ` <span class="badge b-blue">R</span>` : ""}</td>
        <td class="small ${c ? "strike" : ""}">${o.items.map(i => `${qty(i.qty)}× ${esc(i.name)}`).join(", ")}</td>
        <td class="num ${c ? "strike" : ""}">${money(o.total)}</td>
        <td class="num">${money(o.amount_paid)}${o.payments.length ? `<br>${o.payments.map(p => `<span class="small muted" title="${esc(p.notes)}">${fmtDate(manilaParts(new Date(p.paid_at)).date)} ${p.method} ${money(p.amount)}
          <button class="link red" onclick="deletePayment(${p.id})">×</button></span>`).join("<br>")}` : ""}</td>
        <td class="num"><b>${c ? "—" : money(o.balance)}</b></td>
        <td><span class="badge ${statusBadge(o)}">${o.receivable_status.toUpperCase()}</span></td>
        <td>${["unpaid", "partial"].includes(o.receivable_status) ? `<button class="btn sm" onclick="logPayment(${o.id})">LOG PAYMENT</button>` : ""}</td></tr>`; }).join("")
        || `<tr><td colspan="9" class="empty">${show === "open" ? "Nobody owes you anything right now." : "No credit sales yet."}</td></tr>`}</tbody>
    </table></div><p class="small muted">Credit sales come from orders marked “On credit / unpaid”. Voiding the order cancels its receivable.</p></div>`;
}
function logPayment(id) {
  const o = S.receivables.find(x => x.id === id);
  openModal(`Log payment — #${o.id} ${o.customer_name}`, `
    <form onsubmit="submitPayment(event, ${id})">
      <p>Balance: <b>${money(o.balance)}</b> of ${money(o.total)}</p>
      <div class="grid2">
        <label class="field"><span>Amount received (₱)</span><input name="amount" type="number" step="any" min="0" inputmode="decimal" value="${o.balance}" required></label>
        <label class="field"><span>Date & time</span><input name="when" type="datetime-local" value="${localInputNow()}"></label>
      </div>
      <div class="field"><span>Received via</span><div class="chips">${SALE_METHODS.map(m => `<label><input type="radio" name="method" value="${m}" ${m === "GCash" ? "checked" : ""}><span>${m}</span></label>`).join("")}</div></div>
      <label class="field"><span>Notes</span><input name="notes"></label>
      <button class="btn block big">Save payment</button></form>`);
}
async function submitPayment(e, id) {
  e.preventDefault(); const f = e.target;
  try {
    const o = await api(`/orders/${id}/payments`, { method: "POST", body: { amount: Number(f.amount.value), method: f.method.value, paid_at: fromManilaInput(f.when.value), notes: f.notes.value } });
    closeModal(); toast(o.balance > 0 ? `Payment logged — ${money(o.balance)} still owed` : "Fully settled 🎉"); refresh();
  } catch (err) { toast(err.message, true); }
}
async function deletePayment(id) {
  if (!confirm("Remove this payment? The balance goes back up.")) return;
  try { await api(`/payments/${id}`, { method: "DELETE" }); toast("Payment removed"); refresh(); }
  catch (err) { toast(err.message, true); }
}

async function viewLiabilities() {
  const show = S.liabShow || "unpaid";
  const r = await api(`/liabilities?show=${show}`);
  S.liabilities = r.entries;
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Liabilities</h2></div>
    <div class="tiles"><div class="tile"><div class="label">Owed to Gino</div><div class="value">${money(r.unpaid_by_method["Gino"])}</div></div>
      <div class="tile"><div class="label">Owed on credit card</div><div class="value">${money(r.unpaid_by_method["Credit Card"])}</div></div>
      <div class="tile"><div class="label">Total unpaid</div><div class="value">${money(r.unpaid_total)}</div></div></div>
    <div class="chips"><button class="${show === "unpaid" ? "active" : ""}" onclick="S.liabShow='unpaid';refresh()">Unpaid</button>
      <button class="${show === "all" ? "active" : ""}" onclick="S.liabShow='all';refresh()">All (incl. settled)</button></div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Paid by</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead>
      <tbody>${r.entries.map((x, i) => `<tr>
        <td>${fmtDateTime(x.when)}</td><td>${x.kind === "purchase" ? "Purchase" : "Expense"}</td><td>${esc(x.description)}${x.attachments.length ? ` ${attachmentLinks(x.attachments)}` : ""}</td>
        <td><span class="badge ${x.payment_method === "Gino" ? "b-blue" : "b-gray"}">${esc(x.payment_method)}</span></td><td class="num"><b>${money(x.total)}</b></td>
        <td>${x.settled_at ? `<span class="badge b-green">SETTLED</span> <span class="small muted">${fmtDate(manilaParts(new Date(x.settled_at)).date)} via ${esc(x.settled_method)}</span>` : `<span class="badge b-red">UNPAID</span>`}</td>
        <td>${x.settled_at ? `<button class="link" onclick="unsettle('${x.kind}', ${x.id})">undo</button>` : `<button class="btn sm" onclick="reimburse(${i})">REIMBURSE</button>`}</td></tr>`).join("")
        || `<tr><td colspan="7" class="empty">${show === "unpaid" ? "Nothing owed." : "No Gino or credit card purchases/expenses yet."}</td></tr>`}</tbody>
    </table></div><p class="small muted">Any purchase or expense paid by <b>Gino</b> or <b>Credit Card</b> shows up here as UNPAID until the business pays it back.</p></div>`;
}
function reimburse(i) {
  const x = S.liabilities[i];
  openModal(`${x.payment_method === "Gino" ? "Reimburse Gino" : "Pay credit card"} — ${money(x.total)}`, `
    <form onsubmit="submitReimburse(event, '${x.kind}', ${x.id})">
      <p class="muted">${esc(x.description)} · ${fmtDateTime(x.when)}</p>
      <div class="field"><span>Paid back from</span><div class="chips">${SALE_METHODS.map(m => `<label><input type="radio" name="method" value="${m}" ${m === "GCash" ? "checked" : ""}><span>${m}</span></label>`).join("")}</div></div>
      <label class="field"><span>Date & time</span><input name="when" type="datetime-local" value="${localInputNow()}"></label>
      <button class="btn block big">Mark as SETTLED</button></form>`);
}
async function submitReimburse(e, kind, id) {
  e.preventDefault(); const f = e.target;
  try { await api(`/liabilities/${kind}/${id}/reimburse`, { method: "POST", body: { method: f.method.value, settled_at: fromManilaInput(f.when.value) } }); closeModal(); toast("Settled"); refresh(); }
  catch (err) { toast(err.message, true); }
}
async function unsettle(kind, id) {
  if (!confirm("Mark this as unpaid again?")) return;
  try { await api(`/liabilities/${kind}/${id}/unsettle`, { method: "POST" }); toast("Back to unpaid"); refresh(); }
  catch (err) { toast(err.message, true); }
}

// ============================================================================
// OPERATIONS — Inventory (batch production + monthly count + count history)
// ============================================================================
async function viewInventory() {
  const sub = S.invTab || "production";
  if (sub === "production") await viewProduction(); else await viewCounts();
  $("#view").insertAdjacentHTML("afterbegin", `<div class="chips" style="margin-bottom:16px">
    ${[["production", "Batch production"], ["count", "Monthly count"], ["history", "Count history"]].map(([k, l]) =>
      `<button class="${sub === k ? "active" : ""}" onclick="S.invTab='${k}';S.countId=null;refresh()">${l}</button>`).join("")}</div>`);
}

// ============================================================================
// SETTINGS (web)
// ============================================================================
async function viewSettings() {
  S.settings = await api("/settings");
  const s = S.settings;
  const area = (key, label, rows = 2) => `<label class="field"><span>${label}</span><textarea rows="${rows}" onchange="saveSetting('${key}', this.value)">${esc(s[key])}</textarea></label>`;
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Settings</h2><button class="btn ghost" onclick="logout()">Log out</button></div>
    <div class="card"><h3>Copy-paste messages</h3>
      ${area("msg_customer_header", "Customer message — first line")}
      ${area("msg_customer_footer", "Customer message — last line")}
      ${area("msg_rider_location", "Rider location message")}
      ${area("msg_rider_df", "Rider DF request message")}
      <p class="small muted">Changes save when you click away. The customer message is built as: first line, the items, delivery fee, total, last line.</p></div>
    <div class="card"><h3>Change PIN</h3>
      <form id="pinForm" class="grid3" onsubmit="changePin(event)">
        <label class="field"><span>Current PIN</span><input name="current_pin" type="password" inputmode="numeric" required></label>
        <label class="field"><span>New PIN (4–12 digits)</span><input name="new_pin" type="password" inputmode="numeric" required></label>
        <div style="align-self:end;margin-bottom:10px"><button class="btn">Change PIN</button></div>
      </form><p class="small muted">Changing the PIN logs out every other phone and computer.</p></div>`;
}
async function saveSetting(key, value) {
  try { S.settings = await api("/settings", { method: "PATCH", body: { [key]: value } }); toast("Saved"); }
  catch (err) { toast(err.message, true); }
}
async function changePin(e) {
  e.preventDefault(); const f = e.target;
  try {
    const r = await api("/auth/change-pin", { method: "POST", body: { current_pin: f.current_pin.value, new_pin: f.new_pin.value } });
    TOKEN = r.token; try { localStorage.setItem("rochar_token", TOKEN); } catch (x) {}
    f.reset(); toast("PIN changed");
  } catch (err) { toast(err.message, true); }
}

const VIEWS = {
  orders: viewOrders, sales: viewSales, buy: viewBuy, expense: viewExpense, make: viewMake, count: viewCount,
  dashboard: viewDashboard, customers: viewCustomers, resellers: viewResellers, reconciliation: viewReconciliation,
  receivables: viewReceivables, liabilities: viewLiabilities, inventory: viewInventory,

};

  const h = location.hash.slice(1);
  if (TOKEN && h !== S.tab && TABS.some(t => t[0] === h)) go(h);
});
document.body.classList.toggle("mobile", MODE === "mobile");
renderTabs();
if (TOKEN) { $("#login").classList.add("hidden"); start().catch(() => {}); } else showLogin();
</script>
