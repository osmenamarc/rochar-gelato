<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rochar Gelato</title>
<meta name="theme-color" content="#fbf6f0">
<link rel="icon" type="image/png" href="brand/favicon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rochar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Rochar brand: cream background, chocolate wordmark brown, monogram gold */
    --bg: #fbf6f0; --card: #ffffff; --ink: #322218; --muted: #8a7868; --border: #ece2d6;
    --accent: #443128; --accent-2: #5b4337; --gold: #765101; --gold-soft: #f3e7cc;
    --cream: #f4ebdf; --hover: #fdf9f4; --rail-bg: #f4ebdf;
    --red-bg: #fbe9e6; --red: #b3372a; --amber-bg: #fcf1dc; --amber: #9a6208;
    --green-bg: #e7f2ea; --green: #22733d; --blue-bg: #e7eef8; --blue: #2c5a93;
    --gray-bg: #efebe7; --gray: #6f655e; --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; }
  .serif { font-family: "Playfair Display", Georgia, serif; }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .login-card { background: var(--card); border-radius: 18px; padding: 30px 28px; width: 360px; max-width: 100%; text-align: center;
    border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(68, 49, 40, .10); }
  .login-card .logo { width: 230px; max-width: 80%; display: block; margin: 0 auto 14px; }
  .login-card h1 { font-size: 26px; }
  .login-card p { color: var(--muted); margin: 6px 0 20px; font-size: 13px; }
  .pin { width: 100%; padding: 12px; font-size: 22px; letter-spacing: 8px; text-align: center; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
  .login-error { color: var(--red); min-height: 18px; font-size: 13px; margin: 6px 0; }

  /* ---------- Shell ---------- */
  header.top { background: rgba(251, 246, 240, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); color: var(--ink); padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
  header.top h1 { font-size: 20px; }
  header.top small { color: var(--gold); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; margin-left: 12px; font-family: Inter, sans-serif; font-weight: 600; }
  header.top .wordmark { height: 30px; display: block; }
  header.top h1 { display: flex; align-items: center; }
  header.top .btn.ghost { background: #fff; }
  nav.tabs { background: var(--card); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { background: none; border: none; padding: 13px 14px; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
  nav.tabs button.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
  nav.tabs button .count { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 60px; }
  body.mobile nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; justify-content: space-around;
    border-top: 1px solid var(--border); border-bottom: none; padding-bottom: env(safe-area-inset-bottom); }
  body.mobile nav.tabs button { flex: 1; padding: 12px 2px; font-size: 12.5px; border-bottom: none; border-top: 3px solid transparent; }
  body.mobile nav.tabs button.active { border-top-color: var(--gold); }
  body.mobile main { padding-bottom: 110px; max-width: 640px; }

  /* ---------- Web: hover-to-open sidebar ---------- */
  :root { --rail: 68px; --rail-open: 228px; --ease: cubic-bezier(.22, .8, .24, 1); }
  body:not(.mobile) header.top { padding-left: calc(var(--rail) + 20px); }
  body:not(.mobile) main { margin-left: var(--rail); max-width: none; padding-left: 28px; padding-right: 28px; }
  body:not(.mobile) main > * { max-width: 1200px; margin-left: auto; margin-right: auto; }
  body:not(.mobile) nav.tabs {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--rail); z-index: 40;
    flex-direction: column; overflow: hidden; gap: 2px; padding: 12px 10px;
    background: var(--rail-bg); border: none; border-right: 1px solid var(--border);
    transition: width .32s var(--ease), box-shadow .32s var(--ease);
  }
  body:not(.mobile) nav.tabs:hover, body:not(.mobile) nav.tabs:focus-within {
    width: var(--rail-open); box-shadow: 12px 0 40px rgba(68, 49, 40, .16);
  }
  body:not(.mobile) nav.tabs .brand { display: flex; align-items: center; gap: 12px; padding: 2px 2px 14px; margin-bottom: 4px;
    border-bottom: 1px solid rgba(68, 49, 40, .12); white-space: nowrap; min-height: 58px; }
  body:not(.mobile) nav.tabs .brand .mark { flex: 0 0 44px; width: 44px; height: auto; display: block; }
  body:not(.mobile) nav.tabs .brand span img { height: 22px; display: block; }
  body:not(.mobile) nav.tabs button {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 12px; border: none; border-radius: 10px;
    color: #6b5647; text-align: left; position: relative; transition: background .2s, color .2s;
  }
  body:not(.mobile) nav.tabs button:hover { background: rgba(68, 49, 40, .06); color: var(--accent); }
  body:not(.mobile) nav.tabs button.active { background: #fff; color: var(--gold); font-weight: 600; box-shadow: 0 1px 3px rgba(68, 49, 40, .08); }
  body:not(.mobile) nav.tabs button.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); }
  body:not(.mobile) nav.tabs button svg { flex: 0 0 22px; }
  body:not(.mobile) nav.tabs .lbl, body:not(.mobile) nav.tabs .brand span {
    opacity: 0; transform: translateX(-8px); transition: opacity .18s ease, transform .25s var(--ease); white-space: nowrap;
  }
  body:not(.mobile) nav.tabs:hover .lbl, body:not(.mobile) nav.tabs:focus-within .lbl,
  body:not(.mobile) nav.tabs:hover .brand span, body:not(.mobile) nav.tabs:focus-within .brand span {
    opacity: 1; transform: none; transition-delay: .08s;
  }
  body:not(.mobile) nav.tabs .count { position: absolute; left: 30px; top: 4px; margin: 0; border: 2px solid var(--rail-bg);
    background: #d9534f; transition: left .32s var(--ease), top .32s var(--ease); }
  body:not(.mobile) nav.tabs:hover .count, body:not(.mobile) nav.tabs:focus-within .count { left: 190px; top: 12px; }
  body:not(.mobile) nav.tabs button.active .count { border-color: #fff; }
  .nav-dim { position: fixed; inset: 0; background: rgba(68, 49, 40, .12); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 35; }
  body:not(.mobile) nav.tabs:hover ~ .nav-dim { opacity: 1; }

  /* phone bottom bar: icon over label */
  body.mobile nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; transition: color .2s; }
  body.mobile nav.tabs button svg { width: 21px; height: 21px; transition: transform .25s var(--ease); }
  body.mobile nav.tabs button.active svg { transform: translateY(-2px) scale(1.08); }
  body.mobile nav.tabs .count { position: absolute; top: 5px; left: calc(50% + 6px); margin: 0; }

  /* ---------- Page, modal, card animations ---------- */
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #view.enter { animation: viewIn .32s var(--ease) both; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes modalOut { to { opacity: 0; transform: translateY(12px) scale(.97); } }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sheetOut { to { transform: translateY(100%); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  dialog[open] { animation: modalIn .28s var(--ease); }
  dialog[open]::backdrop { animation: fadeIn .28s ease; }
  dialog.closing { animation: modalOut .2s ease forwards; }
  dialog.closing::backdrop { animation: fadeOut .2s ease forwards; }
  body.mobile dialog { margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  body.mobile dialog[open] { animation: sheetIn .34s var(--ease); }
  body.mobile dialog.closing { animation: sheetOut .24s ease forwards; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
  .ocard.new { animation: cardIn .35s var(--ease); }
  .ocard.leaving { transition: opacity .3s ease, transform .3s ease, max-height .35s ease .1s, margin .35s ease .1s;
    opacity: 0; transform: translateX(40px); max-height: 0 !important; margin-bottom: 0; }
  .ocard-body-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .32s var(--ease); }
  .ocard-body-wrap > div { min-height: 0; overflow: hidden; }
  .ocard.collapsed .ocard-body-wrap { grid-template-rows: 0fr; }
  .ocard .chev { display: inline-block; transition: transform .3s var(--ease); }
  .ocard.collapsed .chev { transform: rotate(-90deg); }
  #toast { transition: opacity .2s, transform .25s var(--ease); transform: translateX(-50%) translateY(10px); }
  #toast.show { transform: translateX(-50%); }
  /* sidebar group headers */
  body:not(.mobile) nav.tabs .grp { font-size: 10.5px; letter-spacing: .12em; font-weight: 600; color: #a08a74; padding: 12px 12px 4px;
    white-space: nowrap; height: 30px; position: relative; }
  body:not(.mobile) nav.tabs .grp span { opacity: 0; transition: opacity .18s ease; }
  body:not(.mobile) nav.tabs .grp::before { content: ""; position: absolute; left: 14px; right: 14px; top: 17px; height: 1px; background: rgba(68, 49, 40, .12); transition: opacity .18s; }
  body:not(.mobile) nav.tabs:hover .grp span, body:not(.mobile) nav.tabs:focus-within .grp span { opacity: 1; transition-delay: .08s; }
  body:not(.mobile) nav.tabs:hover .grp::before, body:not(.mobile) nav.tabs:focus-within .grp::before { opacity: 0; }
  /* typeahead */
  .typeahead { position: relative; }
  .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12); z-index: 30; overflow: hidden; display: none; animation: fadeIn .15s ease; }
  .suggest.show { display: block; }
  .suggest button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--border); padding: 10px 12px; cursor: pointer; }
  .suggest button:last-child { border-bottom: none; }
  .suggest button:hover, .suggest button.hl { background: var(--cream); }
  .suggest mark { background: #f6df9f; border-radius: 3px; padding: 0 1px; }
  /* segmented control */
  .seg { display: inline-flex; background: var(--gray-bg); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: none; background: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted); transition: background .2s, color .2s; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button.on.credit { color: var(--amber); }
  .locked-banner { background: var(--green-bg); color: var(--green); border: 1px solid #b9dcc4; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--hover); }
  .var-pos { color: var(--amber); } .var-neg { color: var(--red); } .var-zero { color: var(--green); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }

  /* ---------- Building blocks ---------- */
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 2px 0 12px; }
  .section-title h2 { font-size: 24px; color: var(--accent); font-weight: 600; letter-spacing: .01em; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { color: var(--accent); font-size: 21px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .neg { color: var(--red); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--cream); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid #efc9c3; }
  .btn.danger:hover { background: var(--red-bg); }
  .btn.green { background: var(--green); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn.block { width: 100%; }
  .btn.big { padding: 13px 16px; font-size: 15px; }
  .link { background: none; border: none; color: var(--blue); cursor: pointer; padding: 0; text-decoration: underline; font-size: 12.5px; }
  .link.red { color: var(--red); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 600; border-top: 2px solid var(--border); }
  tr.group td { background: var(--hover); }
  tr.voided td { color: var(--muted); }
  tr.voided td.strike, .strike { text-decoration: line-through; }
  .empty { color: var(--muted); padding: 18px 4px; text-align: center; }

  /* inline-editable cells */
  td.ed, span.ed { cursor: text; border-radius: 5px; }
  td.ed:hover, span.ed:hover { background: var(--amber-bg); outline: 1px dashed #e4c98f; }
  td.ed.editing { padding: 3px; background: none; outline: none; }
  td.ed input, td.ed select, span.ed input, span.ed select { width: 100%; min-width: 80px; padding: 5px 6px; border: 2px solid var(--accent); border-radius: 6px; background: #fff; }
  td.ed.saving { opacity: .5; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-gray { background: var(--gray-bg); color: var(--gray); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chips button, .chips label { background: var(--card); border: 1px solid var(--border); border-radius: 99px; padding: 7px 13px; cursor: pointer; }
  .chips button.active, .chips input:checked + span { background: var(--accent); color: #fff; }
  .chips label { padding: 0; overflow: hidden; }
  .chips label span { display: block; padding: 7px 13px; }
  .chips input { display: none; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  .filters label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .filters input, .filters select { padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }

  /* ---------- Forms ---------- */
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field > span { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea, .lines input, .lines select {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  .field textarea { min-height: 56px; resize: vertical; }
  body.mobile .field input, body.mobile .field select, body.mobile .field textarea, body.mobile .lines input, body.mobile .lines select { font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .hint { font-size: 12px; color: var(--muted); margin: -2px 0 10px; }
  .form-error { color: var(--red); font-size: 13px; min-height: 18px; margin: 4px 0; }
  .lines { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff; }
  .line { display: grid; grid-template-columns: 1fr 72px 110px 26px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .line.exp { grid-template-columns: 1fr 120px 26px; }
  .line.prod { grid-template-columns: 1fr 90px 26px; }
  .line-head { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .line .rm { background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 0; }
  @media (max-width: 520px) {
    .line:not(.exp):not(.prod) { grid-template-columns: 1fr 1fr 26px; }
    .line:not(.exp):not(.prod) > :first-child { grid-column: 1 / -1; }
  }
  .total-box { background: var(--cream); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 12px; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
  .thumb { width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; background: var(--gray-bg);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); position: relative; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .x { position: absolute; top: 1px; right: 3px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 99px; width: 18px; height: 18px; font-size: 12px; cursor: pointer; line-height: 1; }
  .upload { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border: 2px dashed var(--border); border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 22px; }

  /* ---------- Order cards / POS ---------- */
  .ocard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .ocard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; background: var(--hover); border-bottom: 1px solid var(--border); }
  .ocard.collapsed .ocard-head { border-bottom: none; }
  .ocard-body { padding: 12px 14px 14px; }
  .pos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .pos button { position: relative; text-align: left; background: var(--cream); border: 1px solid #e7d7c1; border-radius: 10px; padding: 10px; cursor: pointer; min-height: 64px; }
  .pos button:active { transform: scale(.97); background: #ead9c1; }
  .pos button b { display: block; font-size: 13px; line-height: 1.25; }
  .pos button span { font-size: 11.5px; color: var(--muted); }
  .pos button .q { position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff; border-radius: 99px; min-width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .oline { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stepper button { background: #fff; border: none; width: 32px; height: 30px; font-size: 17px; cursor: pointer; }
  .stepper span { min-width: 28px; text-align: center; font-weight: 600; }
  .sums { margin: 8px 0 12px; }
  .sums div { display: flex; justify-content: space-between; padding: 2px 0; }
  .sums .grand { font-size: 17px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 6px; }
  .copybar { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 12px 0 10px; }
  @media (min-width: 700px) { .copybar { grid-template-columns: 1fr 1fr 1fr; } }
  .copybar .btn { background: var(--blue-bg); color: var(--blue); border: 1px solid #cdd9ea; }
  .copybar .btn:hover { background: #dbe6f5; }

  .list-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .list-item:last-child { border-bottom: none; }
  .list-item .r { text-align: right; white-space: nowrap; }

  .count-item { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .count-item input { padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; text-align: right; width: 100%; }
  .count-item input:not(:placeholder-shown) { background: var(--green-bg); border-color: #b9dcc4; }
  .sticky-bottom { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; }
  body.mobile .sticky-bottom { bottom: 64px; }

  /* ---------- Modal ---------- */
  dialog { border: none; border-radius: 16px; padding: 0; width: 640px; max-width: calc(100vw - 20px); max-height: calc(100vh - 30px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(30, 18, 12, .45); }
  .modal-head { padding: 16px 18px 6px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; z-index: 1; }
  .modal-head h3 { font-size: 18px; }
  .modal-body { padding: 8px 18px 18px; }
  .x-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
  .proof { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; display: block; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; max-width: calc(100vw - 32px); text-align: center; }
  body.mobile #toast { bottom: 84px; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }
  .loading { color: var(--muted); padding: 30px; text-align: center; }
</style>
</head>
<body>

</header>

<div class="nav-dim"></div>

  <div class="modal-body" id="modalBody"></div>
</dialog>
<div id="toast"></div>

<script>
// ============================================================================
// Rochar Gelato — one app, two layouts:
//   app.rochargelato.com   → phone layout (POS, quick entry)
//   admin.rochargelato.com → web layout (tables with inline editing, reports)
// ============================================================================
const API_BASE = "https://api.rochargelato.com";
const MODE = new URLSearchParams(location.search).get("mode") || (location.hostname.startsWith("app.") ? "mobile" : "web");
const OTHER_SITE = MODE === "mobile" ? ["https://admin.rochargelato.com", "Web admin"] : ["https://app.rochargelato.com", "Phone app"];
const PAYMENTS = ["Cash", "GCash", "Gino", "Credit Card", "Check"];
const DEFAULT_PAYMENT = "Gino";
const CATEGORIES = ["Gelato", "Raw Material", "Packaging"];
const REFRESH_MS = 15000;

const NAV_GROUPS = [
  ["DASHBOARD", [["dashboard", "Dashboard"], ["sales", "Sales"]]],
  ["CLIENTS", [["customers", "Customers"], ["resellers", "Resellers"]]],
  ["FINANCE", [["reconciliation", "Reconciliation"], ["receivables", "Receivables"], ["liabilities", "Liabilities"]]],
  ["OPERATIONS", [["products", "Products"], ["purchases", "Purchases"], ["expenses", "Expenses"], ["inventory", "Inventory"]]],
];
const TABS = MODE === "mobile"
  ? [["orders", "Orders"], ["sales", "Sales"], ["buy", "Buy"], ["expense", "Expense"], ["make", "Make"], ["count", "Count"]]
  : [...NAV_GROUPS.flatMap(g => g[1]), ["settings", "Settings"]];
const SALE_METHODS = ["Cash", "GCash", "Bank"];

// ---------------------------------------------------------------- helpers
let TOKEN = null;
try { TOKEN = localStorage.getItem("rochar_token"); } catch (e) {}
const S = { tab: TABS[0][0], items: [], settings: {}, orders: [], openCount: 0, customers: [], prices: {} };
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && !path.startsWith("/auth/")) { showLogin("Session ended — enter your PIN"); throw new Error("Please log in again."); }
  if (!res.ok) {
    let msg = data && data.detail;
    if (Array.isArray(msg)) msg = msg.map(d => (d.loc ? d.loc.slice(-1)[0] + ": " : "") + d.msg).join("; ");
    throw new Error(msg || ("Server error " + res.status));
  }
  return data;
}

// Money: whole pesos show without decimals (₱1,270), otherwise 2 decimals.
function money(n) {
  const x = Math.round(Number(n || 0) * 100) / 100;
  return (x < 0 ? "−₱" : "₱") + Math.abs(x).toLocaleString("en-PH", { minimumFractionDigits: Number.isInteger(x) ? 0 : 2, maximumFractionDigits: 2 });
}
const qty = n => { const x = Number(n || 0); return Number.isInteger(x) ? x.toLocaleString() : x.toLocaleString(undefined, { maximumFractionDigits: 3 }); };
const itemLabel = (name, variant) => variant ? `${name} (${variant})` : name;

// Dates are always shown and entered in Manila time.
function manilaParts(d = new Date()) {
  const m = new Date(d.getTime() + 8 * 3600 * 1000).toISOString();
  return { date: m.slice(0, 10), time: m.slice(11, 16) };
}
const manilaToday = () => manilaParts().date;
const localInputNow = () => { const p = manilaParts(); return `${p.date}T${p.time}`; };
const toManilaInput = iso => { const p = manilaParts(new Date(iso)); return `${p.date}T${p.time}`; };
const fromManilaInput = v => v ? v + ":00+08:00" : null;
function addDays(ymd, n) { const d = new Date(ymd + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function fmtDate(ymd, dow = true) {
  if (!ymd) return "";
  return new Date(ymd.slice(0, 10) + "T00:00:00").toLocaleDateString("en-US", dow ? { weekday: "short", month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
}
function fmtDateTime(iso) {
  if (!iso) return "";
  const p = manilaParts(new Date(iso));
  const [h, mi] = p.time.split(":").map(Number);
  return `${fmtDate(p.date)} · ${((h + 11) % 12) + 1}:${String(mi).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}
function fmtTime(iso) { return fmtDateTime(iso).split(" · ")[1] || ""; }

function toast(msg, isErr = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", isErr ? 5000 : 2200);
}
function need(cond, msg) { if (!cond) throw new Error(msg); }
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(label + " copied");
}
function fileUrl(id) { return `${API_BASE}/files/${id}?token=${encodeURIComponent(TOKEN)}`; }

// ---------------------------------------------------------------- modal
function openModal(title, html) {
  $("#modalTitle").textContent = title; $("#modalBody").innerHTML = html;
  const d = $("#modal"); d.classList.remove("closing");
  if (!d.open) d.showModal();
}
function closeModal() {
  const d = $("#modal");
  if (!d.open || d.classList.contains("closing")) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return d.close();
  d.classList.add("closing");
  d.addEventListener("animationend", () => { d.classList.remove("closing"); d.close(); }, { once: true });
}
$("#modal").addEventListener("cancel", e => { e.preventDefault(); closeModal(); });   // Esc key
$("#modal").addEventListener("click", e => { if (e.target === $("#modal")) closeModal(); });   // click outside
$("#modal").addEventListener("close", () => { $("#modalBody").innerHTML = ""; });

// ---------------------------------------------------------------- login
async function showLogin(msg) {
  TOKEN = null; try { localStorage.removeItem("rochar_token"); } catch (e) {}
  $("#login").classList.remove("hidden");
  $("#loginError").textContent = ""; $("#pinInput").value = ""; $("#pinInput2").value = "";
  let setup = false;
  try { setup = !(await api("/auth/status")).pin_set; }
  catch (e) { $("#loginError").textContent = "Can't reach the server. Check your internet and try again."; }
  $("#login").dataset.setup = setup ? "1" : "";
  $("#pinInput2").classList.toggle("hidden", !setup);
  $("#loginMsg").textContent = setup ? "First time: create a PIN (6+ digits recommended)" : (msg || "Enter your PIN");
  $("#loginBtn").textContent = setup ? "Create PIN" : "Unlock";
  $("#pinInput").focus();
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pin = $("#pinInput").value.trim(), setup = !!$("#login").dataset.setup;
  $("#loginError").textContent = "";
  if (setup && pin !== $("#pinInput2").value.trim()) { $("#loginError").textContent = "The two PINs don't match."; return; }
  $("#loginBtn").disabled = true;
  try {
    const r = await api(setup ? "/auth/setup" : "/auth/login", { method: "POST", body: { pin } });
    TOKEN = r.token; try { localStorage.setItem("rochar_token", TOKEN); } catch (e) {}
    $("#login").classList.add("hidden");
    await start();
  } catch (err) { $("#loginError").textContent = err.message; }
  finally { $("#loginBtn").disabled = false; }
});
async function logout() {
  if (!confirm("Log out on this device?")) return;
  try { await api("/auth/logout", { method: "POST" }); } catch (e) {}
  showLogin();
}

// ---------------------------------------------------------------- navigation + sync
// Simple line icons (24×24, drawn with strokes)
const ICON_PATHS = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  orders: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  sales: '<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
  products: '<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
  purchases: '<path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>',
  buy: '<path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>',
  expenses: '<rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M16 14.5h2.5"/><path d="M6 6l9-3 1.5 3"/>',
  expense: '<rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M16 14.5h2.5"/><path d="M6 6l9-3 1.5 3"/>',
  production: '<path d="M7 10a5 5 0 0110 0"/><path d="M6 10h12l-5 11h-2z"/><path d="M12 3v2"/>',
  make: '<path d="M7 10a5 5 0 0110 0"/><path d="M6 10h12l-5 11h-2z"/><path d="M12 3v2"/>',
  counts: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10l1.5 1.5L14 8M9 16h6"/>',
  count: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10l1.5 1.5L14 8M9 16h6"/>',
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  customers: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/>',
  resellers: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 01-6 0 3 3 0 01-6 0 3 3 0 01-6 0z"/><path d="M5 13v8h14v-8M10 21v-5h4v5"/>',
  reconciliation: '<path d="M12 3v18M5 7h14"/><path d="M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/>',
  receivables: '<path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4"/>',
  liabilities: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>',
  inventory: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10l1.5 1.5L14 8M9 16h6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
};
const icon = k => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[k] || ""}</svg>`;
function renderTabs() {
  const btn = ([k, label]) => `<button class="${S.tab === k ? "active" : ""}" onclick="go('${k}')" title="${label}">${icon(k)}<span class="lbl">${label}</span>${
    (k === "orders" && S.openCount) ? `<span class="count">${S.openCount}</span>` : ""}</button>`;
  if (MODE === "mobile") { $("#tabs").innerHTML = TABS.map(btn).join(""); return; }
  $("#tabs").innerHTML = `<div class="brand"><img class="mark" src="brand/monogram.png" alt="R"><span><img src="brand/wordmark.png" alt="Rochar"></span></div>` +
    NAV_GROUPS.map(([g, list]) => `<div class="grp"><span>${g}</span></div>` + list.map(btn).join("")).join("");
}
async function go(tab, opts = {}) {
  S.tab = tab; renderTabs();
  for (const k of Object.keys(EDITS)) delete EDITS[k];
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch (e) {}
  if (!opts.quiet) $("#view").innerHTML = `<div class="loading">Loading…</div>`;
  const y = window.scrollY;
  try {
    await VIEWS[tab]();
    if (opts.quiet) window.scrollTo(0, y);
    else { const v = $("#view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); window.scrollTo(0, 0); }
  } catch (err) {
    if (!opts.quiet) $("#view").innerHTML = `<div class="card"><b>Couldn't load this page.</b><p class="muted">${esc(err.message)}</p><button class="btn" onclick="go('${tab}')">Try again</button></div>`;
  }
}
const refresh = () => go(S.tab, { quiet: true });
async function loadItems() { S.items = await api("/items?include_inactive=true"); }
async function loadCustomers() {
  const [list, prices] = await Promise.all([api("/customers"), api("/customers-prices")]);
  S.customers = list; S.prices = {};
  prices.forEach(p => { (S.prices[p.customer_id] = S.prices[p.customer_id] || {})[p.item_id] = p.price; });
}
const priceFor = (o, item) => (o.customer_id && S.prices[o.customer_id] && S.prices[o.customer_id][item.id] !== undefined)
  ? S.prices[o.customer_id][item.id] : item.selling_price;
const activeItems = cat => S.items.filter(i => i.active && (!cat || i.category === cat));

// "Real-time" sync: every 15 s (and whenever the app comes back to the
// foreground) the live screens reload — unless you're in the middle of typing.
const LIVE_TABS = ["orders", "sales", "dashboard", "receivables", "reconciliation"];
function busy() {
  const a = document.activeElement;
  return $("#modal").open || $(".ed.editing") || (a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName))
    || Object.keys(pending).length || Object.keys(fieldSaves).length;
}
setInterval(() => { if (TOKEN && document.visibilityState === "visible" && LIVE_TABS.includes(S.tab) && !busy()) refresh(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (TOKEN && document.visibilityState === "visible" && !busy()) refresh(); });

async function start() {
  document.body.classList.toggle("mobile", MODE === "mobile");
  $("#modeLabel").textContent = MODE === "mobile" ? "" : "Admin";
  $("#switchLink").href = OTHER_SITE[0]; $("#switchLink").textContent = OTHER_SITE[1];
  $("#mobileLogout").classList.toggle("hidden", MODE !== "mobile");
  $("#settingsLink").classList.toggle("hidden", MODE === "mobile");
  [S.settings] = await Promise.all([api("/settings"), loadItems(), loadCustomers()]);
  const hash = location.hash.slice(1);
  go(TABS.some(t => t[0] === hash) ? hash : TABS[0][0]);
}

// ---------------------------------------------------------------- inline editing (web tables)
// editable(...) returns a cell. Click it, change the value, press Enter or
// click away → it saves on its own. Esc cancels.
const EDITS = {}; let editSeq = 0;
function editable(tag, display, cfg, cls = "") {
  const id = "e" + (++editSeq); EDITS[id] = cfg;
  return `<${tag} class="ed ${cls}" data-eid="${id}" title="Click to edit">${display}</${tag}>`;
}
document.addEventListener("click", e => {
  const cell = e.target.closest(".ed");
  if (!cell || cell.classList.contains("editing")) return;
  const cfg = EDITS[cell.dataset.eid]; if (!cfg) return;
  const original = cell.innerHTML;
  cell.classList.add("editing");
  let input;
  if (cfg.type === "select") {
    input = document.createElement("select");
    input.innerHTML = cfg.options.map(o => `<option ${o === cfg.value ? "selected" : ""}>${esc(o)}</option>`).join("");
  } else if (cfg.type === "bool") {
    input = document.createElement("select");
    input.innerHTML = `<option value="true" ${cfg.value ? "selected" : ""}>Yes</option><option value="false" ${!cfg.value ? "selected" : ""}>No</option>`;
  } else {
    input = document.createElement("input");
    input.type = { money: "number", qty: "number", int: "number", datetime: "datetime-local", date: "date" }[cfg.type] || "text";
    if (["money", "qty"].includes(cfg.type)) { input.step = "any"; input.min = "0"; input.inputMode = "decimal"; }
    input.value = cfg.type === "datetime" ? toManilaInput(cfg.value) : (cfg.value ?? "");
  }
  cell.innerHTML = ""; cell.appendChild(input); input.focus(); if (input.select) try { input.select(); } catch (x) {}
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    let v = input.value;
    if (cfg.type === "bool") v = v === "true";
    else if (["money", "qty", "int"].includes(cfg.type)) v = v === "" ? 0 : Number(v);
    else if (cfg.type === "datetime") v = fromManilaInput(v);
    const unchanged = cfg.type === "datetime" ? toManilaInput(cfg.value) === input.value : String(v) === String(cfg.value ?? "");
    if (!save || unchanged) { cell.classList.remove("editing"); cell.innerHTML = original; return; }
    cell.classList.add("saving");
    try {
      await api(cfg.url, { method: "PATCH", body: { [cfg.field]: v } });
      toast("Saved");
      if (cfg.after) await cfg.after(); else await refresh();
    } catch (err) {
      toast(err.message, true); cell.classList.remove("editing", "saving"); cell.innerHTML = original;
    }
  };
  input.addEventListener("keydown", k => {
    if (k.key === "Enter") { k.preventDefault(); input.blur(); }
    if (k.key === "Escape") { finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
  if (input.tagName === "SELECT") input.addEventListener("change", () => input.blur());
});

// ---------------------------------------------------------------- shared form bits
function payChips(name, selected = DEFAULT_PAYMENT) {
  return `<div class="chips" role="radiogroup">${PAYMENTS.map(p =>
    `<label><input type="radio" name="${name}" value="${p}" ${p === selected ? "checked" : ""}><span>${p}</span></label>`).join("")}</div>`;
}
function dateRangeFilter(key, days) {
  if (!S[key]) S[key] = { from: addDays(manilaToday(), -(days - 1)), to: manilaToday() };
  const r = S[key];
  return `<div class="filters">
    <label>From<input type="date" value="${r.from}" onchange="S['${key}'].from=this.value;refresh()"></label>
    <label>To<input type="date" value="${r.to}" onchange="S['${key}'].to=this.value;refresh()"></label>
    <div class="row">${[["Today", 0], ["7 days", 6], ["30 days", 29]].map(([l, n]) =>
      `<button class="btn ghost sm" onclick="S['${key}']={from:addDays(manilaToday(),-${n}),to:manilaToday()};refresh()">${l}</button>`).join("")}</div>
  </div>`;
}
const rangeQuery = key => `date_from=${S[key].from}&date_to=${S[key].to}`;

// Photos are shrunk before upload (max 1600 px, JPEG) so they upload fast
// on mobile data and don't fill up the database.
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
async function prepareFile(file) {
  if (file.type === "application/pdf") {
    need(file.size <= 5 * 1024 * 1024, `${file.name} is over 5 MB.`);
    return { filename: file.name, mime: file.type, data_b64: await readAsDataURL(file), preview: null };
  }
  need(file.type.startsWith("image/"), `${file.name}: only photos and PDFs can be attached.`);
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Couldn't read that photo.")); i.src = url; });
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL("image/jpeg", 0.72);
  return { filename: (file.name || "photo").replace(/\.\w+$/, "") + ".jpg", mime: "image/jpeg", data_b64: out, preview: out };
}

const pending = {};                // order id → true while a save is in flight
const queues = {};                 // order id → promise chain (keeps taps in order)
let collapsed = {};

function saveCollapsed() { try { localStorage.setItem("rochar_collapsed", JSON.stringify(collapsed)); } catch (e) {} }

function enqueue(orderId, fn) {
  pending[orderId] = (pending[orderId] || 0) + 1;
  const run = (queues[orderId] || Promise.resolve()).then(fn).catch(err => { toast(err.message, true); return reloadOrder(orderId); })
    .finally(() => { if (--pending[orderId] <= 0) delete pending[orderId]; });
  queues[orderId] = run;
  return run;
}
async function reloadOrder(id) {

}
function replaceOrder(o) {

  if (o.status !== "open") { if (i >= 0) S.orders.splice(i, 1); }

}

function toggleCard(id) {
  collapsed[id] = !collapsed[id]; if (!collapsed[id]) delete collapsed[id];
  saveCollapsed();
  const card = $("#oc" + id); if (card) card.classList.toggle("collapsed", !!collapsed[id]);   // animates open/closed

function bump(orderId, itemId, delta) {
  const o = S.orders.find(x => x.id === orderId); if (!o) return;
  const item = S.items.find(i => i.id === itemId);
  let line = o.items.find(i => i.item_id === itemId);
  const newQty = Math.max(0, (line ? line.qty : 0) + delta);
  // Update the screen right away, then save in the background.
  if (line) { if (newQty) { line.qty = newQty; line.amount = newQty * line.unit_price; } else o.items = o.items.filter(i => i !== line); }
  else if (newQty && item) { const pr = priceFor(o, item); o.items.push({ item_id: itemId, name: item.name, variant: item.variant, qty: newQty, unit_price: pr, amount: newQty * pr }); }
  o.subtotal = o.items.reduce((s, i) => s + i.amount, 0); o.total = o.subtotal + Number(o.delivery_fee || 0);
  drawOrderCard(orderId);
  enqueue(orderId, async () => {
    const fresh = await api(`/orders/${orderId}/items/${itemId}`, { method: "PUT", body: { qty: newQty } });
    if (pending[orderId] === 1) replaceOrder(fresh);   // last save in line → show the server's version
  });
}
// Typing in a field saves ~0.7 s after you stop (or right away when you leave it).
const fieldSaves = {};   // "orderId:field" → { timer, run }
function fieldChanged(orderId, inp, now = false) {
  const o = S.orders.find(x => x.id === orderId); if (!o) return;
  const f = inp.dataset.f;
  const v = f === "delivery_fee" ? Number(inp.value || 0) : inp.value;
  o[f] = v;
  const card = $("#oc" + orderId);
  if (f === "delivery_fee") {
    o.total = o.subtotal + v;
    $(".oc-df", card).textContent = money(v); $(".oc-grand", card).textContent = money(o.total); $(".oc-total", card).textContent = money(o.total);
  }
  if (f === "customer_name") $(".oc-name", card).innerHTML = v ? esc(v) : `<span class="muted">New order</span>`;
  const key = orderId + ":" + f;
  if (fieldSaves[key]) clearTimeout(fieldSaves[key].timer);
  const run = () => { delete fieldSaves[key]; return enqueue(orderId, () => api(`/orders/${orderId}`, { method: "PATCH", body: { [f]: v } })); };
  if (now) run(); else fieldSaves[key] = { timer: setTimeout(run, 700), run };
}
async function flushOrder(id) {
  // send anything typed but not yet saved, then wait for all saves to finish
  for (const [key, s] of Object.entries(fieldSaves)) if (key.startsWith(id + ":")) { clearTimeout(s.timer); s.run(); }
  await queues[id];
}
// ---- customer typeahead: fuzzy match on name / phone
function fuzzy(q, text) {
  q = q.toLowerCase().trim(); text = (text || "").toLowerCase();
  if (!q) return 0;
  const at = text.indexOf(q);
  if (at >= 0) return 100 - at;                       // contains the letters in a row
  if (q.split(/\s+/).every(w => text.includes(w))) return 60;   // every word appears somewhere
  let i = 0; for (const ch of text) if (ch === q[i]) i++;   // letters in order, with gaps
  return i === q.length ? 20 : 0;
}
function highlight(text, q) {
  const at = (text || "").toLowerCase().indexOf(q.toLowerCase().trim());
  if (at < 0 || !q.trim()) return esc(text);
  const n = q.trim().length;
  return esc(text.slice(0, at)) + "<mark>" + esc(text.slice(at, at + n)) + "</mark>" + esc(text.slice(at + n));
}
function showSuggestions(orderId, q) {
  const box = $("#sg" + orderId); if (!box) return;
  if ((q || "").trim().length < 2) { box.classList.remove("show"); return; }
  const hits = S.customers.map(c => ({ c, score: Math.max(fuzzy(q, c.name), fuzzy(q, c.phone) - 5) }))
    .filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 6);
  box.innerHTML = hits.length ? hits.map((h, i) => `<button type="button" class="${i === 0 ? "hl" : ""}" data-cid="${h.c.id}" onmousedown="event.preventDefault(); linkCustomer(${orderId}, ${h.c.id})">
      <span><b>${highlight(h.c.name, q)}</b><br><span class="small muted">${esc(h.c.phone)}${h.c.address ? " · " + esc(h.c.address) : ""}</span></span>
      <span class="badge ${h.c.tier === "Reseller" ? "b-blue" : "b-gray"}">${h.c.tier}</span></button>`).join("")
    : `<div class="small muted" style="padding:10px 12px">No match — this will be saved as a new client.</div>`;
  box.classList.add("show");
}
function suggestKeys(orderId, e) {
  const box = $("#sg" + orderId); if (!box || !box.classList.contains("show")) return;
  const opts = $$("button", box); if (!opts.length) return;
  let i = opts.findIndex(b => b.classList.contains("hl"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); opts[i]?.classList.remove("hl");
    i = (i + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length; opts[i].classList.add("hl");
  } else if (e.key === "Enter" && i >= 0) { e.preventDefault(); linkCustomer(orderId, Number(opts[i].dataset.cid)); }
  else if (e.key === "Escape") box.classList.remove("hl", "show");
}
async function linkCustomer(orderId, customerId) {
  $("#sg" + orderId)?.classList.remove("show");
  // drop any half-typed name so it doesn't overwrite the chosen client
  for (const [key, s] of Object.entries(fieldSaves)) if (key.startsWith(orderId + ":")) { clearTimeout(s.timer); delete fieldSaves[key]; }
  if (document.activeElement) document.activeElement.blur();
  await enqueue(orderId, async () => {
    const fresh = await api(`/orders/${orderId}/customer`, { method: "PUT", body: { customer_id: customerId } });
    replaceOrder(fresh);
    if (customerId) toast(`${fresh.customer_name} selected`);
  });
}
function setPay(orderId, field, value) {
  const o = S.orders.find(x => x.id === orderId); if (!o || o[field] === value) return;
  o[field] = value; drawOrderCard(orderId);
  enqueue(orderId, () => api(`/orders/${orderId}`, { method: "PATCH", body: { [field]: value } }));
}
async function copyOrder(id, which) {
  const o = S.orders.find(x => x.id === id); if (!o) return;
  if (which === "customer") { if (!o.items.length) return toast("Add items first", true); copyText(orderMessage(o), "Customer message"); }
  if (which === "location") copyText(S.settings.msg_rider_location || "", "Rider location");
  if (which === "df") copyText(S.settings.msg_rider_df || "", "Rider DF request");
}
async function finishOrder(id) {
  const o = S.orders.find(x => x.id === id); if (!o) return;
  if (!o.items.length) return toast("Add at least one item first", true);
  if (!confirm(`Finish order #${id}${o.customer_name ? " for " + o.customer_name : ""} — ${money(o.total)}${o.payment_status === "credit" ? " ON CREDIT" : " paid by " + o.payment_method}?\nIt moves to Sales history${o.payment_status === "credit" ? " and Receivables" : ""}.`)) return;
  try {
    await flushOrder(id);
    const done = await api(`/orders/${id}/finish`, { method: "POST" });
    S.orders = S.orders.filter(x => x.id !== id); S.openCount = S.orders.length; renderTabs();
    drawOrderCard(id); toast(`Order #${id} finished — ${money(done.total)}`);
    loadCustomers().catch(() => {});   // pick up a newly saved client
  } catch (err) { toast(err.message, true); }
}
async function cancelOrder(id) {
  const o = S.orders.find(x => x.id === id); if (!o) return;
  try {
    if (!o.items.length) {
      if (!confirm(`Delete empty order #${id}?`)) return;
      await queues[id]; await api(`/orders/${id}`, { method: "DELETE" });
    } else {
      const reason = prompt(`Void order #${id}? It stays in Sales history, crossed out.\nReason (optional):`, "");
      if (reason === null) return;
      await queues[id]; await api(`/orders/${id}/void`, { method: "POST", body: { reason } });
    }
    S.orders = S.orders.filter(x => x.id !== id); S.openCount = S.orders.length; renderTabs(); drawOrderCard(id);
    toast(o.items.length ? `Order #${id} voided` : "Deleted");
  } catch (err) { toast(err.message, true); }
}

async function voidSale(id) {

const LEDGER = {

  expense: { path: "expenses", when: "spent_at", title: "Expense", lineName: "particulars" },

function purchaseItemOptions() {
  return [...activeItems("Raw Material"), ...activeItems("Packaging")].map(i => itemLabel(i.name, i.variant));
}
function ledgerForm(kind) {
  const isP = kind === "purchase";
  return `<form id="lf_${kind}" onsubmit="submitLedger(event, '${kind}')">
    <label class="field"><span>Date & time</span><input type="datetime-local" name="when" value="${localInputNow()}"></label>

    <div class="total-box"><span>Total</span><span id="total_${kind}">₱0</span></div>
    <div class="field"><span>Payment method</span>${payChips("pay_" + kind)}</div>
    <div class="field"><span>${isP ? "Proof of purchase" : "Proof of payment"}</span><div>${filePicker(kind)}</div></div>
    <label class="field"><span>Notes (optional)</span><input name="notes"></label>
    <div class="form-error" id="err_${kind}"></div>
    <button class="btn block big" id="save_${kind}">Save ${isP ? "purchase" : "expense"}</button>
  </form>`;
}
function addLedgerRow(kind) {
  const row = document.createElement("div");
  row.className = "line" + (kind === "expense" ? " exp" : "");
  row.innerHTML = kind === "purchase"
    ? `<input name="name" list="itemList" placeholder="Item name" autocomplete="off">
       <input name="qty" type="number" inputmode="decimal" step="any" min="0" placeholder="Qty" value="1">
       <input name="amount" type="number" inputmode="decimal" step="any" min="0" placeholder="₱ Amount" oninput="ledgerTotal('purchase')">
       <button type="button" class="rm" onclick="this.parentElement.remove();ledgerTotal('purchase')">×</button>`
    : `<input name="name" placeholder="e.g. Meralco bill" autocomplete="off">
       <input name="amount" type="number" inputmode="decimal" step="any" min="0" placeholder="₱ Amount" oninput="ledgerTotal('expense')">
       <button type="button" class="rm" onclick="this.parentElement.remove();ledgerTotal('expense')">×</button>`;
  $("#rows_" + kind).appendChild(row);
}
function ledgerTotal(kind) {
  const t = $$(`#rows_${kind} [name=amount]`).reduce((s, i) => s + Number(i.value || 0), 0);
  $("#total_" + kind).textContent = money(t);
}
function initLedgerForm(kind) { addLedgerRow(kind); addLedgerRow(kind); }
async function submitLedger(e, kind) {
  e.preventDefault();
  const f = e.target, isP = kind === "purchase", btn = $("#save_" + kind);
  $("#err_" + kind).textContent = "";
  try {
    const lines = $$(`#rows_${kind} .line`).map(r => {
      const name = $("[name=name]", r).value.trim(), amount = $("[name=amount]", r).value;
      if (!name && !amount) return null;
      need(name, "Every line with an amount needs a name.");
      need(amount !== "", `Enter the amount for “${name}”.`);
      if (!isP) return { particulars: name, amount: Number(amount) };
      const match = S.items.find(i => itemLabel(i.name, i.variant).toLowerCase() === name.toLowerCase());
      return { item_id: match ? match.id : null, item_name: name, qty: Number($("[name=qty]", r).value || 1), amount: Number(amount) };
    }).filter(Boolean);
    need(lines.length, isP ? "Add at least one item." : "Add at least one line.");
    btn.disabled = true; btn.textContent = "Saving…";
    const body = { payment_method: f.querySelector(`[name=pay_${kind}]:checked`).value, notes: f.notes.value, lines, attachments: pickers[kind].map(({ preview, ...a }) => a) };
    body[LEDGER[kind].when] = fromManilaInput(f.when.value);
    const saved = await api("/" + LEDGER[kind].path, { method: "POST", body });
    toast(`${LEDGER[kind].title} saved — ${money(saved.total)}`);
    if ($("#modal").open) closeModal();
    refresh();
  } catch (err) { $("#err_" + kind).textContent = err.message; }
  finally { if (btn) { btn.disabled = false; btn.textContent = `Save ${isP ? "purchase" : "expense"}`; } }
}

function loadDraft() { try { return JSON.parse(localStorage.getItem("rochar_count_draft") || "{}"); } catch (e) { return {}; } }
function saveDraft() {
  const d = { date: $("#countDate")?.value, qty: {} };
  $$("[data-count]").forEach(i => { if (i.value !== "") d.qty[i.dataset.count] = i.value; });
  try { localStorage.setItem("rochar_count_draft", JSON.stringify(d)); } catch (e) {}
  const filled = Object.keys(d.qty).length, total = $$("[data-count]").length;
  if ($("#countProgress")) $("#countProgress").textContent = `${filled} of ${total} counted`;
  let value = 0; $$("[data-count]").forEach(i => { value += Number(i.value || 0) * Number(i.dataset.cost); });
  if ($("#countValue")) $("#countValue").textContent = money(value);
}
async function countChecklistHtml() {
  const list = await api("/counts/checklist");
  const draft = loadDraft();
  S.checklist = list;
  if (!list.length) return `<div class="card"><b>No products yet.</b> <span class="muted">Add your gelato, raw materials and packaging in the web admin → Products first.</span></div>`;
  let html = "", cat = "";
  for (const i of list) {
    if (i.category !== cat) { cat = i.category; html += `<h3 style="margin:16px 0 4px">${esc(cat)}</h3>`; }
    const v = draft.qty?.[i.item_id] ?? "";
    html += `<div class="count-item"><div>${esc(i.name)}${i.variant ? ` <span class="muted">(${esc(i.variant)})</span>` : ""}<br>
      <span class="small muted">${money(i.unit_cost)} each${i.last_qty !== null && i.last_qty !== undefined ? ` · last count ${qty(i.last_qty)}` : ""}</span></div>
      <input type="number" inputmode="decimal" step="any" min="0" placeholder="count" data-count="${i.item_id}" data-cost="${i.unit_cost}" value="${esc(v)}" oninput="saveDraft()"></div>`;
  }
  return `<div class="card">
    <label class="field"><span>Count date (the last day of the month you're counting)</span><input type="date" id="countDate" value="${draft.date || manilaToday()}" onchange="saveDraft()"></label>
    <p class="hint">Count everything on hand: gelato in the freezer, raw materials, packaging. Your progress is kept on this device until you submit.</p>
    ${html}
    <div class="sticky-bottom"><div class="total-box"><span id="countProgress"></span><span>Ending inventory <span id="countValue"></span></span></div>
      <button class="btn block big" onclick="submitCount()">Submit count</button></div></div>`;
}
async function submitCount() {
  const inputs = $$("[data-count]");
  const blanks = inputs.filter(i => i.value === "").length;
  if (blanks && !confirm(`${blanks} item${blanks === 1 ? " is" : "s are"} blank and will be counted as 0. Submit anyway?`)) return;
  const lines = inputs.map(i => ({ item_id: Number(i.dataset.count), qty: Number(i.value || 0) }));
  const date = $("#countDate").value;
  if (!confirm(`Submit the count for ${fmtDate(date, false)}? It becomes this period's Ending Inventory and next period's Beginning Inventory.`)) return;
  try {
    const c = await api("/counts", { method: "POST", body: { count_date: date, lines } });
    try { localStorage.removeItem("rochar_count_draft"); } catch (e) {}
    toast(`Count saved — ending inventory ${money(c.total_value)}`);
    if (MODE === "web") { S.invTab = "history"; S.countId = null; } refresh();
  } catch (err) { toast(err.message, true); }
}

function periodTable(periods) {
  const rows = periods.map(p => p.opening
    ? `<tr><td>Opening count · ${fmtDate(p.period_end, false)}</td><td colspan="10" class="muted">Starting balance: ${money(p.ending_inventory)} — profit is calculated from the next count onward.</td></tr>`
    : `<tr class="clickable" onclick="S.dashRange={from:'${addDays(p.period_start, 1)}',to:'${p.period_end}',label:'period'};refresh()">
      <td>${fmtDate(addDays(p.period_start, 1))} → ${fmtDate(p.period_end, false)}${p.warning ? `<br><span class="badge b-red">${esc(p.warning)}</span>` : ""}</td>
      <td class="num">${money(p.beginning_inventory)}</td><td class="num">${money(p.purchases)}</td><td class="num">${money(p.ending_inventory)}</td>
      <td class="num ${p.cogs < 0 ? "neg" : ""}">${money(p.cogs)}${p.cogs < 0 ? " ⚠" : ""}</td>
      <td class="num">${money(p.sales)}</td><td class="num ${p.gross_profit < 0 ? "neg" : ""}">${money(p.gross_profit)}</td>
      <td class="num">${p.gross_margin_pct === null ? "—" : p.gross_margin_pct + "%"}</td>
      <td class="num">${money(p.expenses)}</td><td class="num ${p.net_profit < 0 ? "neg" : ""}"><b>${money(p.net_profit)}</b></td>
      <td class="num">${p.orders}</td></tr>`).join("");
  return `<div class="table-wrap"><table>
    <thead><tr><th>Count period</th><th class="num">Beginning inv.</th><th class="num">+ Purchases</th><th class="num">− Ending inv.</th><th class="num">= COGS</th>
      <th class="num">Sales</th><th class="num">Gross profit</th><th class="num">Margin</th><th class="num">OpEx</th><th class="num">Net profit</th><th class="num">Orders</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="11" class="empty">No counts yet. Do your first inventory count to set the opening balance.</td></tr>`}</tbody></table></div>`;
}
function dashPresets() {
  const t = manilaToday(), dow = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7;   // Monday = 0
  return { today: [t, t], week: [addDays(t, -dow), t], month: [t.slice(0, 8) + "01", t] };
}
async function viewDashboard() {
  if (!S.dashRange) { const [f, to] = dashPresets().today; S.dashRange = { from: f, to, label: "today" }; }
  const r = S.dashRange;
  const d = await api(`/dashboard?date_from=${r.from}&date_to=${r.to}`);
  const periodsDone = d.periods.filter(p => !p.opening);
  const tile = (label, value, cls = "", note = "") => `<div class="tile"><div class="label">${label}</div><div class="value ${cls}">${value}</div>${note ? `<div class="small muted" style="margin-top:4px">${note}</div>` : ""}</div>`;
  const needPeriod = "Pick a count period below";
  const preset = k => `<button class="${r.label === k ? "active" : ""}" onclick="const p=dashPresets().${k};S.dashRange={from:p[0],to:p[1],label:'${k}'};refresh()">${{ today: "Today", week: "This Week", month: "This Month" }[k]}</button>`;
  $("#view").innerHTML = `
    <div class="section-title"><h2 class="serif">Dashboard</h2>
      <span class="muted">${r.from === r.to ? fmtDate(r.from, false) : fmtDate(r.from) + " → " + fmtDate(r.to, false)}</span></div>
    <div class="row" style="margin-bottom:12px">
      <div class="chips" style="margin:0">${preset("today")}${preset("week")}${preset("month")}
        <button class="${r.label === "custom" ? "active" : ""}" onclick="S.dashRange={...S.dashRange,label:'custom'};refresh()">Custom</button></div>
      ${r.label === "custom" ? `<div class="filters" style="margin:0">
        <label>From<input type="date" value="${r.from}" onchange="S.dashRange.from=this.value;refresh()"></label>
        <label>To<input type="date" value="${r.to}" onchange="S.dashRange.to=this.value;refresh()"></label></div>` : ""}
      ${periodsDone.length ? `<div class="filters" style="margin:0"><label>Count period
        <select onchange="if(this.value){const [f,t]=this.value.split('|');S.dashRange={from:f,to:t,label:'period'};refresh()}">
          <option value="">—</option>${periodsDone.map(p => { const f = addDays(p.period_start, 1);
            return `<option value="${f}|${p.period_end}" ${r.from === f && r.to === p.period_end ? "selected" : ""}>${fmtDate(f)} → ${fmtDate(p.period_end, false)}</option>`; }).join("")}
        </select></label></div>` : ""}
    </div>
    <div class="tiles">
      ${tile("Gross Sales", money(d.gross_sales), "", `${d.orders} order${d.orders === 1 ? "" : "s"} · items only`)}
      ${tile("COGS", d.cogs === null ? "—" : money(d.cogs), d.cogs < 0 ? "neg" : "", d.cogs === null ? needPeriod : "Beg. + Purchases − End.")}
      ${tile("OpEx", money(d.opex), "", "Expenses")}
      ${tile("Net Profit", d.net_profit === null ? "—" : money(d.net_profit), d.net_profit < 0 ? "neg" : "", d.net_profit === null ? needPeriod : "Sales − COGS − OpEx")}
    </div>
    <div class="tiles">
      ${tile("Delivery fees collected", money(d.delivery_fees))}
      ${tile("Purchases", money(d.purchases))}
      ${tile(`<a href="#receivables">Receivables outstanding</a>`, money(d.receivables_outstanding))}
      ${tile(`<a href="#liabilities">Unpaid liabilities</a>`, money(d.liabilities_unpaid))}
      ${tile(`<a href="#reconciliation">Days not reconciled</a>`, d.unreconciled_days, d.unreconciled_days ? "neg" : "")}
      ${tile("Open orders now", d.open_orders)}
    </div>
    <div class="card"><h3>Profit by count period</h3>${periodTable(d.periods)}
      <p class="small muted">COGS only exists between two inventory counts (periodic method), so it shows for a count period — click a row or use the dropdown.
        Delivery fees are pass-through and excluded from profit; voided orders are excluded everywhere; wastage and freebies land in COGS automatically.</p>
      ${d.periods.some(p => p.cogs < 0) ? `<p class="small"><span class="badge b-amber">⚠ Negative COGS</span> means inventory grew more than you bought — usually a missed purchase, a count typo, or unit costs set too high.</p>` : ""}
    </div>`;
}
